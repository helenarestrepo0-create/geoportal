<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance catastral · Valledupar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/rbush@4.0.1/rbush.min.js"></script>
<script src="https://unpkg.com/flatgeobuf@3.36.0/dist/flatgeobuf-geojson.min.js"></script>

<style>
:root{
  --tinta:#0e141a;
  --tinta-2:#18222b;
  --linea:#2b3844;
  --linea-2:#3a4a58;
  --texto:#e8eff5;
  --texto-2:#8ea3b6;
  --texto-3:#5f7386;
  --foco:#4cc2ff;
  --entregado:#22c55e;
  --listo:#38bdf8;
  --proceso:#f5a524;
  --gaveta:0px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:14px/1.45 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--texto); background:#080d12; -webkit-font-smoothing:antialiased;
}
#mapa{position:absolute;top:0;left:0;right:0;bottom:var(--gaveta);background:#080d12;
      transition:bottom .22s cubic-bezier(.4,0,.2,1)}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      font-variant-numeric:tabular-nums}
button{font:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}

.panel{
  position:absolute;z-index:600;background:rgba(14,20,26,.95);
  border:1px solid var(--linea);border-radius:5px;
  backdrop-filter:blur(8px);box-shadow:0 10px 32px rgba(0,0,0,.6);
}

/* ══ barras de herramientas ══ */
#barra, #barra-d{
  position:absolute;top:12px;z-index:820;
  display:flex;flex-direction:column;gap:2px;padding:5px;
  background:rgba(14,20,26,.95);border:1px solid var(--linea);
  border-radius:6px;backdrop-filter:blur(8px);
  box-shadow:0 8px 26px rgba(0,0,0,.6);
}
#barra{left:12px}
#barra-d{right:12px}
#barra-d:empty{display:none}
#barra button, #barra-d button{
  width:34px;height:34px;border:0;border-radius:4px;cursor:pointer;
  background:none;color:var(--texto-2);display:grid;place-items:center;
  transition:.13s;position:relative;
}
#barra button:hover, #barra-d button:hover{background:var(--tinta-2);color:var(--texto)}
#barra button.on, #barra-d button.on{background:var(--foco);color:#06121c}
#barra button svg, #barra-d button svg{width:18px;height:18px;stroke-width:1.7;
  stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
#barra .sep, #barra-d .sep{height:1px;background:var(--linea);margin:3px 4px}
#barra button::after, #barra-d button::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 9px);
  white-space:nowrap;background:rgba(14,20,26,.97);color:var(--texto);
  border:1px solid var(--linea-2);border-radius:4px;padding:4px 9px;
  font-size:11.5px;opacity:0;pointer-events:none;transition:opacity .12s;
}
#barra button:hover::after, #barra-d button:hover::after{opacity:1}
#barra-d button::after{left:auto;right:calc(100% + 9px)}

/* los paneles se abren al lado de la barra */
.cajon{
  position:absolute;top:12px;left:60px;z-index:610;width:290px;
  max-height:calc(100vh - var(--gaveta) - 24px);overflow-y:auto;
  display:none;
}
.cajon.abierto{display:block;animation:entra .16s ease-out}
@keyframes entra{from{opacity:0;transform:translateX(-6px)}
                 to{opacity:1;transform:none}}

#cabecera{padding:14px 17px 13px}
#cabecera h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:-.01em}
#cabecera .sub{color:var(--texto-2);font-size:11.5px;margin-bottom:13px}
.cifra{display:flex;align-items:baseline;gap:9px}
.cifra .n{font-size:33px;font-weight:600;letter-spacing:-.03em;line-height:1}
.cifra .pct{font-size:14px;color:var(--entregado);font-weight:600}
.cifra-pie{color:var(--texto-2);font-size:11.5px;margin:3px 0 13px}
.medidor{height:5px;background:#101a22;border-radius:3px;overflow:hidden;
         display:flex;margin-bottom:13px}
.medidor i{display:block;height:100%;transition:width .25s ease}
table.tot{width:100%;border-collapse:collapse;font-size:12.5px}
table.tot td{padding:3.5px 0;border:0}
table.tot td:last-child{text-align:right}
table.tot tr{cursor:pointer;transition:opacity .15s}
table.tot tr:hover td{color:#fff}
table.tot tr.off{opacity:.3}
.marca{display:inline-block;width:9px;height:9px;border-radius:2px;
       margin-right:8px;vertical-align:-1px}
.divisor{height:1px;background:var(--linea);margin:12px 0 11px}
.dual{font-size:11.5px;color:var(--texto-2);line-height:1.75}
.dual b{color:var(--texto);font-weight:600}

#filtros{padding:13px 15px 14px}
#filtros .titulo{font-size:11px;color:var(--texto-2);margin-bottom:10px}
.campo{margin-bottom:9px}
.campo label{display:block;font-size:11px;color:var(--texto-3);margin-bottom:3px}
.campo select,.campo input{
  width:100%;background:#0a1016;border:1px solid var(--linea);color:var(--texto);
  border-radius:4px;padding:6px 9px;font-size:12.5px;transition:border-color .15s;
}
.campo select:hover,.campo input:hover{border-color:var(--linea-2)}
.campo select:focus,.campo input:focus{border-color:var(--foco);outline:none}
.campo input::placeholder{color:var(--texto-3)}
#buscar-wrap{position:relative}
#sugerencias{
  position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:3px;
  background:var(--tinta);border:1px solid var(--linea-2);border-radius:4px;
  max-height:210px;overflow-y:auto;display:none;box-shadow:0 8px 22px rgba(0,0,0,.6);
}
#sugerencias.abierto{display:block}
.sug{padding:7px 10px;cursor:pointer;font-size:12px;
     border-bottom:1px solid rgba(43,56,68,.6)}
.sug:last-child{border:0}
.sug:hover,.sug.activo{background:var(--tinta-2)}
.sug .meta{color:var(--texto-3);font-size:10.5px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip-f{display:inline-flex;align-items:center;gap:6px;background:var(--tinta-2);
        border:1px solid var(--linea-2);border-radius:12px;
        padding:3px 5px 3px 10px;font-size:11px}
.chip-f button{background:none;border:0;color:var(--texto-2);cursor:pointer;
               font-size:14px;line-height:1;padding:0 3px}
.chip-f button:hover{color:#fff}
#resultado{margin-top:11px;padding-top:11px;border-top:1px solid var(--linea);
           font-size:12px;color:var(--texto-2);line-height:1.7}
#resultado b{color:var(--texto);font-weight:600}
#resultado .grande{font-size:19px;font-weight:600;color:var(--texto);
                   letter-spacing:-.02em}

#capas{padding:11px 14px 12px}
#capas .titulo{font-size:11px;color:var(--texto-2);margin-bottom:8px}
.fila-capa{display:flex;align-items:center;gap:9px;padding:4px 0;
           cursor:pointer;font-size:12.5px;user-select:none}
.fila-capa:hover{color:#fff}
.fila-capa input{accent-color:var(--foco);margin:0;cursor:pointer}
.fila-capa .n{margin-left:auto;color:var(--texto-3);font-size:11px}
.pin{width:9px;height:9px;border-radius:2px;flex:none}
#capas details{margin-top:7px}
#capas summary{cursor:pointer;font-size:11px;color:var(--texto-2);padding:3px 0}
#capas summary:hover{color:var(--texto)}
.aviso{font-size:11px;color:var(--proceso);line-height:1.5;margin:7px 0 4px}

/* dos fichas a la derecha: predio arriba, construccion debajo.
   Comparten estilo; la de construccion se abre solo al pinchar una. */
#ficha, #ficha-c{--acento:#4cc2ff;right:60px;width:312px;
       padding:0;display:none;overflow:hidden;flex-direction:column}
#ficha{top:12px;max-height:calc(100vh - var(--gaveta) - 24px)}
#ficha.doble{max-height:calc(50vh - var(--gaveta)/2 - 16px)}
#ficha-c{top:12px;max-height:calc(100vh - var(--gaveta) - 24px)}
#ficha-c.bajo{top:auto;bottom:calc(var(--gaveta) + 12px);
              max-height:calc(50vh - var(--gaveta)/2 - 16px)}
#ficha.abierta, #ficha-c.abierta{display:flex}
#ficha .cab, #ficha-c .cab{
  padding:11px 14px 11px;border-bottom:1px solid var(--linea);
  display:flex;align-items:flex-start;gap:10px;flex:none;
  border-left:3px solid var(--acento);
}
#ficha .rotulo, #ficha-c .rotulo{font-size:10.5px;color:var(--texto-3);letter-spacing:.04em;
               text-transform:uppercase;margin-bottom:2px}
#ficha .npn, #ficha-c .npn{font-size:12.5px;word-break:break-all;line-height:1.35}
#ficha .cerrar, #ficha-c .cerrar{margin-left:auto;background:none;border:0;color:var(--texto-2);
               font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
#ficha .cerrar:hover, #ficha-c .cerrar:hover{color:#fff}
#ficha .cuerpo, #ficha-c .cuerpo{padding:0 0 12px;overflow-y:auto}

.chip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;
      font-weight:600}
.tira-estado{padding:9px 14px 10px;border-bottom:1px solid var(--linea)}

/* ── grupos plegables: mucha información sin abrumar ── */
.grupo{border-bottom:1px solid var(--linea)}
.grupo > summary{
  list-style:none;cursor:pointer;user-select:none;
  padding:9px 14px;display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--texto-2);transition:.12s;
}
.grupo > summary::-webkit-details-marker{display:none}
.grupo > summary:hover{color:var(--texto);background:rgba(76,194,255,.05)}
.grupo > summary .flecha{
  margin-left:auto;font-size:9px;opacity:.5;transition:transform .16s;
}
.grupo[open] > summary .flecha{transform:rotate(90deg)}
.grupo > summary .marca-g{
  width:3px;height:12px;border-radius:2px;flex:none;background:var(--texto-3);
}

dl.attr{margin:0;font-size:12.5px;padding:0 14px 10px}
dl.attr div{display:flex;gap:10px;align-items:baseline;padding:5px 0;
            border-bottom:1px solid rgba(43,56,68,.35)}
dl.attr div:last-child{border-bottom:0}
dl.attr dt{color:var(--texto-2);flex:0 0 46%;font-size:11.5px;line-height:1.35}
dl.attr dd{margin:0;flex:1;text-align:right;word-break:break-word;
           font-variant-numeric:tabular-nums;line-height:1.35}
dl.attr dd.dato{font-weight:500}

/* dato destacado: lo que se busca de un vistazo */
.destacados{display:flex;gap:1px;background:var(--linea);
            border-bottom:1px solid var(--linea)}
.destacados > div{flex:1;background:var(--tinta);padding:9px 12px}
.destacados .k{font-size:10px;color:var(--texto-3);
               text-transform:uppercase;letter-spacing:.03em}
.destacados .v{font-size:16px;font-weight:600;letter-spacing:-.02em;
               margin-top:1px;font-variant-numeric:tabular-nums}

#gaveta{position:absolute;left:0;right:0;bottom:0;z-index:700;height:0;
        background:rgba(14,20,26,.97);border-top:1px solid var(--linea);
        display:flex;flex-direction:column;backdrop-filter:blur(8px);
        transition:height .22s cubic-bezier(.4,0,.2,1)}
#gaveta.abierta{height:290px}
#gaveta .barra{display:flex;align-items:center;gap:13px;padding:9px 14px;
               border-bottom:1px solid var(--linea);flex:none}
#gaveta .barra .tit{font-size:12.5px;font-weight:600}
#gaveta .barra .cuenta{color:var(--texto-2);font-size:11.5px}
.seg{display:flex;background:#0a1016;border:1px solid var(--linea);border-radius:4px}
.seg button{background:none;border:0;color:var(--texto-2);padding:4px 12px;
            font-size:11.5px;cursor:pointer;border-radius:3px;transition:.12s}
.seg button.on{background:var(--tinta-2);color:var(--texto)}
.seg button:hover{color:var(--texto)}
.btn{background:#0a1016;border:1px solid var(--linea);color:var(--texto-2);
     border-radius:4px;padding:4px 11px;font-size:11.5px;cursor:pointer;
     transition:.12s}
.btn:hover{border-color:var(--linea-2);color:var(--texto)}
#g-cerrar{margin-left:auto;background:none;border:0;color:var(--texto-2);
          font-size:19px;cursor:pointer;line-height:1;padding:0 4px}
#g-cerrar:hover{color:#fff}
#scroll{flex:1;overflow-y:auto;position:relative}
#tabla{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
#tabla thead th{position:sticky;top:0;z-index:2;background:#141d25;text-align:left;
  font-weight:600;font-size:11px;color:var(--texto-2);padding:7px 11px;
  border-bottom:1px solid var(--linea);cursor:pointer;white-space:nowrap;
  user-select:none}
#tabla thead th:hover{color:var(--texto)}
#tabla thead th .flecha{opacity:.45;margin-left:4px;font-size:9px}
#tabla td{padding:5px 11px;border-bottom:1px solid rgba(43,56,68,.35);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabla tbody tr{cursor:pointer}
#tabla tbody tr:hover{background:rgba(76,194,255,.09)}
#tabla tbody tr.sel{background:rgba(76,194,255,.16)}
.punto-est{display:inline-block;width:7px;height:7px;border-radius:50%;
           margin-right:7px;vertical-align:0}
#abrir-tabla{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
             z-index:600;padding:7px 17px;font-size:12px}
#gaveta.abierta ~ #abrir-tabla{display:none}

#estado{bottom:calc(var(--gaveta) + 12px);left:12px;padding:7px 13px;
        font-size:11.5px;color:var(--texto-2);
        transition:bottom .22s cubic-bezier(.4,0,.2,1)}
#estado b{color:var(--texto);font-weight:600}

#carga{position:absolute;inset:0;z-index:1200;display:flex;align-items:center;
       justify-content:center;flex-direction:column;gap:13px;background:#080d12;
       color:var(--texto-2);font-size:13px}
#carga .barra{width:190px;height:2px;background:#1a242e;overflow:hidden}
#carga .barra i{display:block;height:100%;width:38%;background:var(--foco);
                animation:desliza 1.05s ease-in-out infinite}
@keyframes desliza{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}

.tt-predio{position:absolute;z-index:650;pointer-events:none;display:none;
  background:rgba(14,20,26,.96);border:1px solid var(--linea-2);border-radius:4px;
  padding:6px 10px;font-size:11.5px;line-height:1.5;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.55)}
.tt-predio .e{font-size:10.5px;color:var(--texto-2)}

.leaflet-control-attribution{background:rgba(14,20,26,.85)!important;
  color:var(--texto-3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:#7fb4d6!important}
.leaflet-control-zoom a{background:rgba(14,20,26,.95)!important;
  color:var(--texto)!important;border-color:var(--linea)!important}
.leaflet-control-zoom a:hover{background:var(--tinta-2)!important}
.leaflet-control-scale-line{background:rgba(14,20,26,.8)!important;
  color:var(--texto)!important;border-color:var(--linea)!important}
.leaflet-tooltip.zona{background:rgba(14,20,26,.95);border:1px solid var(--linea-2);
  color:var(--texto);font-size:11.5px;box-shadow:none}
.leaflet-tooltip.zona::before{display:none}

@media (max-width:820px){
  .cajon{left:56px;right:12px;width:auto}
  #barra-d{flex-direction:row;top:auto;bottom:12px;right:12px}
  #barra-d button::after{left:auto;right:0;bottom:calc(100% + 9px)}
  #ficha, #ficha-c{left:12px;right:12px;width:auto}
  #ficha{top:auto;bottom:calc(var(--gaveta) + 12px);max-height:46vh}
  #ficha.doble{max-height:30vh}
  #ficha-c{top:12px;max-height:30vh}
  #ficha-c.bajo{top:12px;bottom:auto;max-height:30vh}
  #estado{display:none}
  #gaveta.abierta{height:230px}
}
</style>
</head>
<body>

<div id="mapa"></div>
<div class="tt-predio" id="tt"></div>

<div id="carga">
  <div>Cargando predios…</div>
  <div class="barra"><i></i></div>
  <div id="carga-detalle" style="font-size:11.5px;color:#5f7386"></div>
</div>

<!-- ══════════ barra de herramientas ══════════ -->
<div id="barra">
  <button data-cajon="cabecera" data-tip="Avance" aria-label="Avance">
    <svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V10M12 20V4M18 20v-7"/></svg>
  </button>
  <button data-cajon="filtros" data-tip="Filtrar" aria-label="Filtrar">
    <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
  </button>
  <button data-cajon="capas" data-tip="Capas" aria-label="Capas">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
  </button>
  <div class="sep"></div>
  <button id="b-tabla" data-tip="Tabla de predios" aria-label="Tabla">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M3 10h18M9 10v10"/></svg>
  </button>
</div>

<div class="panel cajon" id="cabecera">
  <h1>Avance de actualización catastral</h1>
  <div class="sub" id="sub">Valledupar · corte —</div>
  <div class="cifra">
    <span class="n mono" id="c-entregado">—</span>
    <span class="pct mono" id="c-pct"></span>
  </div>
  <div class="cifra-pie">predios entregados</div>
  <div class="medidor" id="medidor"></div>
  <table class="tot"><tbody id="totales"></tbody></table>
  <div class="divisor"></div>
  <div class="dual" id="dual"></div>
</div>

<div class="panel cajon" id="filtros">
  <div class="titulo">Filtrar</div>
  <div class="campo" id="buscar-wrap">
    <label for="q">Buscar predio, barrio o manzana</label>
    <input id="q" type="search" placeholder="NPN, nombre o manzana" autocomplete="off">
    <div id="sugerencias"></div>
  </div>
  <div class="campo">
    <label for="f-uit">Unidad de intervención</label>
    <select id="f-uit"><option value="">Todas</option></select>
  </div>
  <div class="campo">
    <label for="f-barrio">Barrio</label>
    <select id="f-barrio"><option value="">Todos</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="resultado"></div>
</div>

<div class="panel cajon" id="capas">
  <div class="titulo">Capas</div>
  <div id="lista-capas"></div>
  <details id="det-calidad">
    <summary>Revisión de calidad</summary>
    <div class="aviso">No cuentan en el avance. Revísalas antes de publicar.</div>
    <div id="lista-calidad"></div>
  </details>
</div>

<!-- ══════════ barra derecha: fichas ══════════ -->
<div id="barra-d">
  <button id="b-predio" data-tip="Ficha del predio" aria-label="Ficha del predio">
    <svg viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13"/>
      <path d="M9 21v-7h6v7"/></svg>
  </button>
  <button id="b-constr" data-tip="Ficha de la construcción"
          aria-label="Ficha de la construcción">
    <svg viewBox="0 0 24 24"><rect x="3" y="9" width="8" height="12"/>
      <rect x="13" y="4" width="8" height="17"/><path d="M6 13h2M6 17h2M16 8h2M16 12h2M16 16h2"/></svg>
  </button>
</div>

<div class="panel" id="ficha">
  <div class="cab">
    <div style="min-width:0">
      <div class="rotulo" id="f-rotulo">Predio</div>
      <div class="npn mono" id="f-npn"></div>
    </div>
    <button class="cerrar" id="f-cerrar" aria-label="Cerrar ficha">×</button>
  </div>
  <div class="cuerpo" id="f-cuerpo"></div>
</div>

<div class="panel" id="ficha-c">
  <div class="cab">
    <div style="min-width:0">
      <div class="rotulo" id="fc-rotulo">Construcción</div>
      <div class="npn mono" id="fc-npn"></div>
    </div>
    <button class="cerrar" id="fc-cerrar" aria-label="Cerrar">×</button>
  </div>
  <div class="cuerpo" id="fc-cuerpo"></div>
</div>

<div id="gaveta">
  <div class="barra">
    <span class="tit">Predios</span>
    <span class="cuenta mono" id="g-cuenta">—</span>
    <div class="seg">
      <button id="g-todos" class="on">Todos</button>
      <button id="g-vis">En pantalla</button>
    </div>
    <button class="btn" id="g-csv">Exportar CSV</button>
    <button id="g-cerrar" aria-label="Cerrar tabla">×</button>
  </div>
  <div id="scroll">
    <table id="tabla">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="panel" id="estado">
  <b id="e-vis">0</b> en pantalla · zoom <b id="e-zoom">14</b>
</div>

<script>
"use strict";

const CFG = {
  datos:'data/',
  orto:'https://xyz1.falconprecision.co/valledupar-urbano/Z{z}/{y}/{x}.png',
  centro:[10.4631,-73.2532], zoom:14,
  limites:[[10.38,-73.32],[10.55,-73.18]],
  zoomPuntos:17,        // aparecen junto con los terrenos
  filaAlto:26
};

const ESTADOS = {
  ENTREGADO:  {label:'Entregado',      color:'#22c55e'},
  LISTO:      {label:'Listo para SIG', color:'#38bdf8'},
  EN_PROCESO: {label:'En proceso',     color:'#f5a524'},
  ERROR_ETAPA:{label:'Error de etapa', color:'#f4426c'},
  CANCELADO:  {label:'Cancelado',      color:'#7c8b99'},
  SIN_MATRIZ: {label:'Sin matriz',     color:'#a78bfa'}
};
const ETAPAS = {juridico:'Jurídico', reconocimiento:'Reconocimiento',
                geografico:'Geográfico'};

const nf = n => (n||0).toLocaleString('es-CO');
const pf = n => n.toFixed(1).replace('.',',');

const S = {
  tabla:null, ficha:null, resumen:null, dominios:{},
  puntos:[], indice:null,
  porFila:new Map(), col:{}, val:null,
  idx:{},
  filtros:{uit:'', barrio:'', manzana:''},
  ocultos:new Set(),
  visibles:null,
  seleccion:null, hover:null,
  ambito:'todos',
  orden:{campo:'npn', asc:true},
  zonas:{}, poli:{}, volando:false, selTipo:null, ultimaConstr:null
};

/* ── mapa ── */
const map = L.map('mapa',{
  center:CFG.centro, zoom:CFG.zoom, minZoom:12, maxZoom:22,
  maxBounds:CFG.limites, maxBoundsViscosity:.9,
  preferCanvas:true, zoomControl:false
});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);

const orto = L.tileLayer(CFG.orto,{
  attribution:'Ortofoto Falcon Precision',
  minZoom:0, maxZoom:22, maxNativeZoom:22,
  bounds:CFG.limites, keepBuffer:3}).addTo(map);

// Si una tesela no existe, se sustituye por el trozo correspondiente
// de la del nivel anterior. Se recorta y escala con CSS para que quede
// EXACTAMENTE sobre su lugar: si se pusiera la tesela del nivel de
// arriba tal cual, cubriria cuatro veces el area y la foto se veria
// corrida respecto a los poligonos.
orto.on('tileerror', e => {
  const t = e.tile, c = e.coords;
  if(t.dataset.sustituida || c.z < 13) return;
  t.dataset.sustituida = '1';

  const px = Math.floor(c.x / 2), py = Math.floor(c.y / 2);
  const dx = c.x - px * 2, dy = c.y - py * 2;

  t.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  t.style.backgroundImage = 'url("' + CFG.orto
      .replace('{z}', c.z - 1).replace('{x}', px).replace('{y}', py) + '")';
  t.style.backgroundSize = '200% 200%';
  t.style.backgroundPosition = (-dx * 100) + '% ' + (-dy * 100) + '%';
  t.style.imageRendering = 'auto';
});

const etiquetas = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:20,
   maxNativeZoom:20, pane:'shadowPane'}).addTo(map);

map.createPane('zonas');   map.getPane('zonas').style.zIndex = 410;
map.createPane('poli');    map.getPane('poli').style.zIndex    = 430;
map.createPane('calidad'); map.getPane('calidad').style.zIndex = 440;
map.createPane('pts');     map.getPane('pts').style.zIndex = 460;
map.createPane('resalte'); map.getPane('resalte').style.zIndex = 480;

const lienzo = L.canvas({pane:'pts', padding:.3});
const capaPts = L.layerGroup([],{pane:'pts'}).addTo(map);
const capaResalte = L.layerGroup([],{pane:'resalte'}).addTo(map);
const capaVista   = L.layerGroup([],{pane:'resalte'}).addTo(map);

/* ══════════ BARRA DE HERRAMIENTAS ══════════
   Solo un cajon abierto a la vez: el mapa queda despejado y el
   encuadre sabe exactamente cuanto espacio esta ocupado.        */

S.cajon = null;

function abrirCajon(id){
  const abrir = S.cajon !== id;
  document.querySelectorAll('.cajon').forEach(c =>
    c.classList.toggle('abierto', abrir && c.id === id));
  document.querySelectorAll('#barra button[data-cajon]').forEach(b =>
    b.classList.toggle('on', abrir && b.dataset.cajon === id));
  S.cajon = abrir ? id : null;
}

document.querySelectorAll('#barra button[data-cajon]').forEach(b =>
  b.onclick = () => abrirCajon(b.dataset.cajon));

/* ── carga ── */
const detalle = t => {
  const d = document.getElementById('carga-detalle');
  if(d) d.textContent = t;
};

async function traer(archivo, obligatorio=true){
  try{
    const r = await fetch(CFG.datos + archivo);
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  }catch(e){
    if(obligatorio) throw new Error('No se pudo leer ' + archivo);
    return null;
  }
}

async function arrancar(){
  try{
    detalle('indicadores');
    S.resumen = await traer('resumen.json');

    detalle('atributos');
    S.tabla = await traer('tabla.json');
    S.dominios = await traer('dominios.json', false) || {};

    detalle('geometrías');
    const geo = await traer('predios.geojson');

    detalle('indexando');
    construirIndices(geo);

    pintarCabecera();
    pintarFiltros();
    pintarCapas();
    inicializarPoligonos();
    pintarEncabezadoTabla();
    aplicarFiltros();
    dibujarPoligonos();

    document.getElementById('carga').style.display = 'none';
    abrirCajon('cabecera');
    acomodarFichas();
    traer('ficha.json', false).then(f => { S.ficha = f; });
    cargarZonas();
  }catch(e){
    document.getElementById('carga').innerHTML =
      '<div style="color:#f4426c;max-width:430px;text-align:center;line-height:1.65">'
      + e.message +
      '<div style="color:#5f7386;font-size:12px;margin-top:9px">'
      + 'Copia la carpeta <code>publico/</code> del corte a <code>data/</code> '
      + 'y abre la página por HTTP, no con doble clic.</div></div>';
  }
}

function construirIndices(geo){
  S.tabla.campos.forEach((c,i) => S.col[c.key] = i);
  const cat = S.tabla.catalogo || {};

  S.val = (fila, key) => {
    const i = S.col[key];
    if(i === undefined) return null;
    const v = fila[i];
    if(v === null || v === undefined) return null;
    return cat[key] ? cat[key][v] : v;
  };

  for(const k of ['uit','barrio','estado']){
    if(S.col[k] === undefined) continue;
    const m = new Map();
    S.tabla.filas.forEach((f,i) => {
      const v = S.val(f,k);
      if(v == null) return;
      if(!m.has(v)) m.set(v, new Set());
      m.get(v).add(i);
    });
    S.idx[k] = m;
  }

  for(const f of geo.features){
    const c = f.geometry.coordinates;
    const p = {i:f.properties.i, x:c[0], y:c[1], e:f.properties.e};
    S.puntos.push(p);
    S.porFila.set(p.i, p);
  }
  S.indice = new RBush();
  S.indice.load(S.puntos.map(p => ({minX:p.x,minY:p.y,maxX:p.x,maxY:p.y,p})));
}

/* ── filtros ── */
function interseccion(a,b){
  const ch = a.size < b.size ? a : b;
  const gr = ch === a ? b : a;
  const r = new Set();
  for(const v of ch) if(gr.has(v)) r.add(v);
  return r;
}

function aplicarFiltros(){
  const f = S.filtros;
  let res = null;
  const cruzar = c => { res = res === null ? c : interseccion(res,c); };

  if(f.uit && S.idx.uit && S.idx.uit.has(f.uit)) cruzar(S.idx.uit.get(f.uit));
  if(f.barrio && S.idx.barrio && S.idx.barrio.has(f.barrio))
    cruzar(S.idx.barrio.get(f.barrio));

  if(f.manzana){
    const s = new Set(), iN = S.col.npn;
    S.tabla.filas.forEach((fila,i) => {
      if(String(fila[iN]).startsWith(f.manzana)) s.add(i);
    });
    cruzar(s);
  }

  S.visibles = res;
  pintarChips();
  actualizarResumenFiltrado();
  redibujar();
  pintarTabla();
}

const enFiltro = i => S.visibles === null || S.visibles.has(i);

function pintarFiltros(){
  const llenar = (id, lista) => {
    const sel = document.getElementById(id);
    for(const v of (lista || [])){
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
  };
  llenar('f-uit', S.dominios.uit);
  llenar('f-barrio', S.dominios.barrio);

  document.getElementById('f-uit').onchange = e => {
    S.filtros.uit = e.target.value;
    aplicarFiltros();
    e.target.value ? volarAZona('uit', e.target.value) : quitarZona();
  };
  document.getElementById('f-barrio').onchange = e => {
    S.filtros.barrio = e.target.value;
    aplicarFiltros();
    e.target.value ? volarAZona('barrio', e.target.value) : quitarZona();
  };
}

function pintarChips(){
  const c = document.getElementById('chips');
  c.innerHTML = '';
  const activos = [
    ['uit','Unidad',S.filtros.uit],
    ['barrio','Barrio',S.filtros.barrio],
    ['manzana','Manzana',S.filtros.manzana]
  ].filter(x => x[2]);

  for(const par of activos){
    const k = par[0], label = par[1], v = par[2];
    const el = document.createElement('span');
    el.className = 'chip-f';
    el.innerHTML = '<span>' + label + ': <b>' + v + '</b></span>'
                 + '<button aria-label="Quitar filtro">×</button>';
    el.querySelector('button').onclick = () => {
      S.filtros[k] = '';
      const sel = document.getElementById('f-' + k);
      if(sel) sel.value = '';
      if(k === 'manzana') document.getElementById('q').value = '';
      quitarZona();
      aplicarFiltros();
    };
    c.appendChild(el);
  }
}

function actualizarResumenFiltrado(){
  const div = document.getElementById('resultado');
  if(S.visibles === null){
    div.innerHTML =
      '<div><span class="grande mono">' + nf(S.tabla.filas.length)
      + '</span> predios</div>'
      + '<div style="font-size:11px;color:var(--texto-3);margin-top:2px">'
      + 'Todo el municipio</div>';
    return;
  }
  const cuenta = {};
  for(const i of S.visibles){
    const e = S.val(S.tabla.filas[i],'estado');
    cuenta[e] = (cuenta[e]||0) + 1;
  }
  const total = S.visibles.size;
  const ent = cuenta.ENTREGADO || 0;
  const listo = cuenta.LISTO || 0;
  div.innerHTML =
    '<div><span class="grande mono">' + nf(total) + '</span> predios en la selección</div>'
    + '<div style="margin-top:5px">Entregados <b class="mono">' + nf(ent)
    + '</b> · <b style="color:var(--entregado)">'
    + pf(total ? ent/total*100 : 0) + ' %</b></div>'
    + '<div>Listos <b class="mono">' + nf(listo)
    + '</b> · <b style="color:var(--listo)">'
    + pf(total ? listo/total*100 : 0) + ' %</b></div>';
}

/* ── búsqueda ── */
const cajaQ = document.getElementById('q');
const cajaSug = document.getElementById('sugerencias');
let tSug = null, sugActual = [], sugSel = -1;

cajaQ.addEventListener('input', () => {
  clearTimeout(tSug);
  tSug = setTimeout(sugerir, 180);
});

cajaQ.addEventListener('keydown', e => {
  if(!cajaSug.classList.contains('abierto')) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); moverSug(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); moverSug(-1); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    const s = sugSel >= 0 ? sugActual[sugSel] : sugActual[0];
    if(s) elegirSug(s);
  }else if(e.key === 'Escape') cerrarSug();
});

function moverSug(d){
  const hijos = cajaSug.children;
  if(sugSel >= 0 && hijos[sugSel]) hijos[sugSel].classList.remove('activo');
  sugSel = Math.max(0, Math.min(sugActual.length - 1, sugSel + d));
  if(hijos[sugSel]){
    hijos[sugSel].classList.add('activo');
    hijos[sugSel].scrollIntoView({block:'nearest'});
  }
}

function sugerir(){
  const q = cajaQ.value.trim().toUpperCase();
  sugSel = -1;
  if(q.length < 2) return cerrarSug();

  const res = [];
  const tipos = [['barrio','Barrio'],['uit','Unidad']];
  for(const t of tipos){
    for(const v of (S.dominios[t[0]] || [])){
      if(String(v).toUpperCase().indexOf(q) >= 0){
        const set = S.idx[t[0]] ? S.idx[t[0]].get(v) : null;
        res.push({t:t[0], v:v, label:t[1], n:set ? set.size : 0});
        if(res.length > 6) break;
      }
    }
  }

  if(/^\d+$/.test(q)){
    const iN = S.col.npn;
    let n = 0;
    for(let i = 0; i < S.tabla.filas.length && n < 6; i++){
      const npn = String(S.tabla.filas[i][iN]);
      if(npn.indexOf(q) >= 0){
        res.push({t:'predio', v:npn, i:i,
                  label:S.val(S.tabla.filas[i],'barrio') || 'Predio'});
        n++;
      }
    }
  }

  sugActual = res.slice(0,10);
  if(!sugActual.length) return cerrarSug();

  cajaSug.innerHTML = '';
  for(const s of sugActual){
    const d = document.createElement('div');
    d.className = 'sug';
    d.innerHTML = s.t === 'predio'
      ? '<div class="mono">' + s.v + '</div><div class="meta">' + s.label + '</div>'
      : '<div>' + s.v + '</div><div class="meta">' + s.label + ' · '
        + nf(s.n) + ' predios</div>';
    d.onclick = () => elegirSug(s);
    cajaSug.appendChild(d);
  }
  cajaSug.classList.add('abierto');
}

function elegirSug(s){
  cerrarSug();
  if(s.t === 'predio'){
    cajaQ.value = s.v;
    abrirFicha(s.i);
    const p = S.porFila.get(s.i);
    if(p) map.flyTo([p.y,p.x], 19, {duration:.7});
  }else{
    cajaQ.value = '';
    S.filtros[s.t] = s.v;
    const sel = document.getElementById('f-' + s.t);
    if(sel) sel.value = s.v;
    aplicarFiltros();
    volarAZona(s.t, s.v);
  }
}

function cerrarSug(){
  cajaSug.classList.remove('abierto');
  cajaSug.innerHTML = '';
  sugActual = []; sugSel = -1;
}
document.addEventListener('click', e => {
  if(!e.target.closest('#buscar-wrap')) cerrarSug();
});

/* ── dibujo ── */
let pend = null;
const redibujar = () => {
  clearTimeout(pend);
  pend = setTimeout(() => { if(!S.volando) _redibujar(); }, 80);
};

// mientras dura el vuelo no se redibuja: evita el tirón a media animación
map.on('zoomstart movestart', () => { if(S.volando) clearTimeout(pend); });
map.on('moveend', () => {
  if(!S.volando) return;
  S.volando = false;
  _redibujar();
  dibujarPoligonos();
});

function _redibujar(){
  capaPts.clearLayers();
  const z = map.getZoom();
  document.getElementById('e-zoom').textContent = z;

  if(z < CFG.zoomPuntos){
    document.getElementById('e-vis').textContent = 'acerca para ver predios';
    return;
  }

  const b = map.getBounds().pad(.22);
  const enVista = S.indice.search({
    minX:b.getWest(), minY:b.getSouth(),
    maxX:b.getEast(), maxY:b.getNorth()});

  const r = z >= 19 ? 6 : z >= 17 ? 4.2 : 2.7;
  const hayFiltro = S.visibles !== null;
  let n = 0;

  for(const it of enVista){
    const p = it.p;
    if(S.ocultos.has(p.e)) continue;
    const dentro = !hayFiltro || S.visibles.has(p.i);
    const col = (ESTADOS[p.e] || {}).color || '#888';

    L.circleMarker([p.y,p.x],{
      renderer:lienzo, pane:'pts',
      radius: dentro ? r : r*.5,
      color: dentro ? '#07101a' : 'transparent',
      weight: (dentro && z >= 17) ? 1 : 0,
      fillColor: col,
      fillOpacity: dentro ? .93 : .16,
      interactive:false
    }).addTo(capaPts);
    if(dentro) n++;
  }

  document.getElementById('e-vis').textContent = nf(n);
  if(S.ambito === 'vis') pintarTabla();
}

map.on('moveend zoomend', () => { redibujar(); dibujarPoligonos(); });

/* hover y clic: un solo listener + búsqueda en el índice espacial */
const tt = document.getElementById('tt');
let rafHover = null;

map.on('mousemove', e => {
  if(rafHover) return;
  rafHover = requestAnimationFrame(() => {
    rafHover = null;
    const p = puntoEn(e.latlng, e.containerPoint);
    if(p === S.hover) return;
    S.hover = p;
    if(!p){
      tt.style.display = 'none';
      // solo en zoom cerrado: mas lejos hay demasiadas y no se distinguen
      const c = map.getZoom() >= 19 ? construccionEn(e.latlng) : null;
      if(c){
        const pr = c.properties;
        const conv = pr.c === 0 ? 'No convencional' : 'Convencional';
        tt.innerHTML = '<div>Construcción '
          + (pr.d ? '<b>' + pr.d + '</b>' : '')
          + (pr.p ? ' · ' + pr.p : '') + '</div>'
          + '<div class="e">' + (pr.u || conv) + '</div>';
        tt.style.display = 'block';
        tt.style.left = (e.containerPoint.x + 14) + 'px';
        tt.style.top  = (e.containerPoint.y + 14) + 'px';
        map.getContainer().style.cursor = 'pointer';
      }else{
        map.getContainer().style.cursor = '';
      }
      return;
    }
    const fila = S.tabla.filas[p.i];
    const est = S.val(fila,'estado');
    tt.innerHTML = '<div class="mono">' + fila[S.col.npn] + '</div>'
      + '<div class="e">' + ((ESTADOS[est]||{}).label || est) + '</div>';
    tt.style.display = 'block';
    tt.style.left = (e.containerPoint.x + 14) + 'px';
    tt.style.top  = (e.containerPoint.y + 14) + 'px';
    map.getContainer().style.cursor = 'pointer';
  });
});

/* El tooltip se dibuja en coordenadas de pantalla, asi que cualquier
   cosa que mueva el mapa lo deja pegado en el sitio equivocado: se
   oculta en todos esos casos, no solo al salir del mapa. */
function ocultarTooltip(){
  tt.style.display = 'none';
  S.hover = null;
  map.getContainer().style.cursor = '';
}

map.on('mouseout zoomstart movestart dragstart', ocultarTooltip);
document.getElementById('mapa').addEventListener('mouseleave', ocultarTooltip);

map.on('click', e => {
  ocultarTooltip();
  // 1) el punto del predio tiene prioridad: es el objetivo mas pequeno
  const p = puntoEn(e.latlng, e.containerPoint);
  if(p) return abrirFicha(p.i);

  // 2) si no, se mira si el clic cayo dentro de una construccion
  const c = construccionEn(e.latlng);
  if(c) return abrirFichaConstruccion(c);
});

/* ¿Que construccion contiene este punto?

   Con 190 mil poligonos no se puede preguntar a cada uno. Se filtra
   primero por caja envolvente, que es una comparacion de cuatro
   numeros, y solo sobre los pocos que pasan se hace la prueba
   geometrica real. Si se solapan, gana el de menor area: suele ser
   el anexo dibujado encima de la construccion principal.          */
function construccionEn(latlng){
  const P = S.poli.construcciones;
  if(!P || !map.hasLayer(P.capa)) return null;

  const x = latlng.lng, y = latlng.lat;
  let mejor = null, areaMin = Infinity;

  P.capa.eachLayer(l => {
    const b = l._bounds || (l._bounds = l.getBounds());
    // descarte por caja: cuatro comparaciones antes de tocar la geometria
    if(x < b.getWest() || x > b.getEast() ||
       y < b.getSouth() || y > b.getNorth()) return;
    if(!dentroDe(l.feature.geometry, x, y)) return;
    // si dos se solapan gana el mas pequeno: suele ser el anexo
    // dibujado encima de la construccion principal
    const a = (b.getEast() - b.getWest()) * (b.getNorth() - b.getSouth());
    if(a < areaMin){ areaMin = a; mejor = l.feature; }
  });
  return mejor;
}

/* Punto en poligono por el metodo del rayo: se cuenta cuantas veces
   una linea horizontal cruza el borde. Impar = dentro.            */
function dentroDe(geom, x, y){
  const anillos = geom.type === 'MultiPolygon'
    ? geom.coordinates.flat()
    : geom.coordinates;
  let dentro = false;
  for(const anillo of anillos){
    let d = false;
    for(let i = 0, j = anillo.length - 1; i < anillo.length; j = i++){
      const xi = anillo[i][0], yi = anillo[i][1];
      const xj = anillo[j][0], yj = anillo[j][1];
      if((yi > y) !== (yj > y) &&
         x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d;
    }
    if(d) dentro = !dentro;      // los anillos interiores son huecos
  }
  return dentro;
}

function puntoEn(latlng, cp){
  if(map.getZoom() < CFG.zoomPuntos) return null;
  const tol = map.getZoom() >= 19 ? 10 : 8;
  const nw = map.containerPointToLatLng([cp.x - tol, cp.y - tol]);
  const se = map.containerPointToLatLng([cp.x + tol, cp.y + tol]);
  const cand = S.indice.search({
    minX:nw.lng, minY:se.lat, maxX:se.lng, maxY:nw.lat});
  let mejor = null, dm = Infinity;
  for(const it of cand){
    if(S.ocultos.has(it.p.e)) continue;
    if(S.visibles !== null && !S.visibles.has(it.p.i)) continue;
    const dx = it.p.x - latlng.lng, dy = it.p.y - latlng.lat;
    const d = dx*dx + dy*dy;
    if(d < dm){ dm = d; mejor = it.p; }
  }
  return mejor;
}


/* ══════════ POLIGONOS (terreno y construccion) ══════════

   Se leen de FlatGeobuf por rango HTTP: el navegador descarga solo los
   bytes del area visible, no el archivo entero. Cada capa aparece a
   partir de su zoom minimo, porque a escalas amplias no se distinguen
   y solo gastarian memoria.                                          */

function inicializarPoligonos(){
  const cfg = (S.resumen && S.resumen.poligonos) || {};
  const cont = document.getElementById('lista-capas');

  for(const id in cfg){
    const c = cfg[id];
    // los estilos vienen del manifiesto: '*' para todos, o por valor
    // del campo 'c' (1 convencional, 0 no convencional)
    const est = c.estilos || {'*':{color:c.color||'#888', weight:1,
                                   relleno:c.relleno||0}};

    const capa = L.geoJSON(null, {
      pane:'poli',
      renderer: L.canvas({pane:'poli', padding:.2}),
      interactive:false,   // el clic se resuelve con un solo listener
      style: f => {
        const e = est['*'] || est[String(f.properties.c)] || est['1'];
        return {
          color: e.color,
          weight: e.weight || 1,
          opacity: .95,
          fillColor: e.color,
          fillOpacity: e.relleno || 0,
          dashArray: e.guion || null,
          lineJoin: 'round'
        };
      }
    });

    S.poli[id] = {
      cfg:c, capa:capa, est:est,
      activa:true,
      areas:[],                 // rectangulos ya consultados
      dibujados:new Set(),      // poligonos ya en el mapa
      planos:new Set(),         // piezas GeoJSON ya traidas
      cargando:false, fallo:false
    };

    // una fila por capa, con las muestras de color de sus estilos
    const claves = Object.keys(est);
    const color = est[claves[0]].color;
    cont.appendChild(filaCapa(c.label, color, null, true, c.n,
      on => { S.poli[id].activa = on;
              if(!on) map.removeLayer(capa); else dibujarPoligonos(); }));

    if(claves.length > 1) cont.appendChild(subLeyenda(est));
  }
}

/* muestra los subtipos de una capa (convencional / no convencional) */
function subLeyenda(est){
  const d = document.createElement('div');
  d.style.cssText = 'padding:1px 0 4px 26px;font-size:11px;color:var(--texto-3)';
  d.innerHTML = Object.keys(est).map(k => {
    const e = est[k];
    const linea = e.guion
      ? `border-top:2px dashed ${e.color}`
      : `border-top:2px solid ${e.color}`;
    return `<span style="display:inline-flex;align-items:center;gap:5px;
             margin-right:11px">
             <i style="width:13px;${linea};display:inline-block"></i>
             ${e.label}</span>`;
  }).join('');
  return d;
}

/* Piezas que intersectan la vista. Los archivos van partidos por UIT
   y cada uno declara su caja, asi que se abre solo lo necesario. */
function piezasEnVista(P, b){
  const r = [];
  for(const z in P.cfg.piezas){
    const c = P.cfg.piezas[z].caja;
    if(c[2] < b.getWest() || c[0] > b.getEast() ||
       c[3] < b.getSouth() || c[1] > b.getNorth()) continue;
    r.push(z);
  }
  return r;
}

/* Registro de lo ya descargado.

   Se guardan los rectangulos consultados. Antes de pedir, se comprueba
   si la vista ya esta contenida en alguno: si lo esta, no se pide nada.
   Se hacia con una rejilla fija, pero a zoom alto la pantalla es mas
   pequena que una celda y quedaban huecos sin cargar.

   Los poligonos ya dibujados se registran por su identificador para
   no repetirlos cuando dos consultas se solapan.                    */

function cubierto(P, b){
  const w = b.getWest(), e = b.getEast(),
        s2 = b.getSouth(), n = b.getNorth();
  for(const r of P.areas)
    if(r[0] <= w && r[1] <= s2 && r[2] >= e && r[3] >= n) return true;
  return false;
}

function clave(f){
  // un predio puede tener varias construcciones: se distinguen por
  // el primer vertice, que es unico para cada poligono
  const g = f.geometry;
  let c = g.coordinates;
  while(Array.isArray(c) && Array.isArray(c[0])) c = c[0];
  return f.properties.i + '|' + c[0].toFixed(6) + ',' + c[1].toFixed(6);
}

let pendPoli = null;
function dibujarPoligonos(){
  clearTimeout(pendPoli);
  pendPoli = setTimeout(_dibujarPoligonos, 220);
}

async function _dibujarPoligonos(){
  const z = map.getZoom();

  for(const id in S.poli){
    const P = S.poli[id];

    if(!P.activa || z < P.cfg.zoom_min){
      if(map.hasLayer(P.capa)) map.removeLayer(P.capa);
      continue;
    }
    if(!map.hasLayer(P.capa)) P.capa.addTo(map);
    if(P.cargando) continue;

    // Margen alrededor de la pantalla: suficiente para que un paneo
    // corto no dispare otra peticion, pero no tanto como para abarcar
    // una UIT entera (ahi la libreria deja de leer por rangos y se
    // trae el archivo completo).
    const b = map.getBounds().pad(z >= 19 ? .35 : .18);
    if(cubierto(P, b)) continue;

    P.cargando = true;
    const caja = {minX:b.getWest(), minY:b.getSouth(),
                  maxX:b.getEast(), maxY:b.getNorth()};
    let leidos = 0;

    try{
      for(const zona of piezasEnVista(P, b)){
        const pieza = P.cfg.piezas[zona];
        const rel = P.cfg.carpeta + '/' + pieza.archivo;
        try{
          if(/\.fgb$/i.test(pieza.archivo)){
            const it = flatgeobuf.deserialize(CFG.datos + rel, caja);
            let n = 0;
            for await (const f of it){
              if(!f || !f.geometry) continue;
              const k = clave(f);
              if(P.dibujados.has(k)) continue;
              P.dibujados.add(k);
              P.capa.addData(f);
              leidos++;
              // ceder el hilo: el mapa sigue respondiendo mientras carga
              if(++n % 400 === 0) await new Promise(r => setTimeout(r, 0));
            }
          }else if(!P.planos.has(zona)){
            P.planos.add(zona);
            const d = await traer(rel, false);
            if(d) P.capa.addData(d);
          }
        }catch(err){
          console.warn('pieza ' + pieza.archivo + ': ' + err.message);
          P.fallo = true;
        }
      }

      if(!P.fallo){
        P.areas.push([caja.minX, caja.minY, caja.maxX, caja.maxY]);
        // solo se conservan las ultimas: comprobar 200 rectangulos
        // en cada paneo saldria mas caro que volver a pedir
        if(P.areas.length > 40) P.areas.splice(0, P.areas.length - 40);
      }
      P.fallo = false;

      // liberar memoria si se acumulo demasiado
      if(P.dibujados.size > 120000) limpiarLejanos(P);

    }finally{
      P.cargando = false;
    }
  }
}

/* Con muchos poligonos acumulados el mapa se vuelve pesado.
   Se descarta todo y se vuelve a cargar lo visible.          */
function limpiarLejanos(P){
  P.capa.clearLayers();
  P.dibujados.clear();
  P.areas.length = 0;
}

/* ── cabecera ── */
function pintarCabecera(){
  const r = S.resumen, est = r.estados || {}, total = r.total || 1;
  document.getElementById('sub').textContent =
    'Valledupar · corte ' + fechaCorte(r.corte);

  const ent = est.ENTREGADO || 0;
  document.getElementById('c-entregado').textContent = nf(ent);
  document.getElementById('c-pct').textContent = pf(ent/total*100) + ' %';

  const med = document.getElementById('medidor'); med.innerHTML = '';
  const tb = document.getElementById('totales'); tb.innerHTML = '';

  for(const k in ESTADOS){
    const n = est[k];
    if(!n) continue;

    const i = document.createElement('i');
    i.style.width = (n/total*100) + '%';
    i.style.background = ESTADOS[k].color;
    i.title = ESTADOS[k].label + ': ' + nf(n);
    med.appendChild(i);

    const tr = document.createElement('tr');
    tr.innerHTML = '<td><span class="marca" style="background:'
      + ESTADOS[k].color + '"></span>' + ESTADOS[k].label + '</td>'
      + '<td class="mono">' + nf(n) + '</td>';
    tr.title = 'Mostrar u ocultar en el mapa';
    tr.onclick = () => {
      if(S.ocultos.has(k)) S.ocultos.delete(k); else S.ocultos.add(k);
      tr.classList.toggle('off', S.ocultos.has(k));
      redibujar();
    };
    tb.appendChild(tr);
  }

  const a = r.avance;
  if(a){
    let h = '<div>Universo actual · <b>' + pf(a.universo_actual.pct)
          + ' %</b> de ' + nf(a.universo_actual.total) + '</div>';
    if(a.universo_inicial){
      h += '<div>Listado inicial · <b>' + pf(a.universo_inicial.pct)
         + ' %</b> de ' + nf(a.universo_inicial.total) + '</div>'
         + '<div><b>' + nf(a.nuevos_entregados)
         + '</b> entregados hallados en campo</div>';
    }
    document.getElementById('dual').innerHTML = h;
  }
}

function fechaCorte(c){
  if(!c || c.length !== 8) return c || '—';
  const m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return c.slice(6,8) + ' ' + m[+c.slice(4,6)-1] + ' ' + c.slice(0,4);
}

/* ══════════ FICHA ══════════

   El panel muestra bastantes campos, asi que se ordena en tres niveles:
     1. cabecera con el identificador y el estado, siempre visible
     2. dos o tres datos destacados, los que se buscan de un vistazo
     3. el resto agrupado en secciones plegables

   La cabecera lleva el color de lo seleccionado, para que se sepa sin
   leer si se hizo clic en un predio o en una construccion.          */

function pintarFicha({rotulo, titulo, acento, chip, destacados, grupos},
                    destino){
  const pre = destino === 'c' ? 'fc' : 'f';
  const f = document.getElementById(destino === 'c' ? 'ficha-c' : 'ficha');
  f.style.setProperty('--acento', acento);
  document.getElementById(pre + '-rotulo').textContent = rotulo;
  document.getElementById(pre + '-npn').textContent = titulo;

  const c = document.getElementById(pre + '-cuerpo');
  c.innerHTML = '';

  if(chip){
    const t = document.createElement('div');
    t.className = 'tira-estado';
    t.innerHTML = '<span class="chip" style="background:' + chip.color
      + '22;color:' + chip.color + '">' + chip.texto + '</span>';
    c.appendChild(t);
  }

  if(destacados && destacados.length){
    const d = document.createElement('div');
    d.className = 'destacados';
    d.innerHTML = destacados.map(x =>
      '<div><div class="k">' + x[0] + '</div>'
      + '<div class="v">' + x[1] + '</div></div>').join('');
    c.appendChild(d);
  }

  for(const g of grupos){
    if(!g.filas.length) continue;
    const det = document.createElement('details');
    det.className = 'grupo';
    if(g.abierto !== false) det.open = true;
    det.innerHTML =
      '<summary><span class="marca-g" style="background:'
      + (g.color || 'var(--texto-3)') + '"></span>' + g.titulo
      + '<span class="flecha">▶</span></summary>'
      + '<dl class="attr">' + g.filas.map(fl =>
          '<dt>' + fl[0] + '</dt><dd class="dato">' + fl[1] + '</dd>')
          .map(x => '<div>' + x + '</div>').join('')
      + '</dl>';
    c.appendChild(det);
  }
  f.classList.add('abierta');
}

function fmt(v, dec){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'number')
    return v.toLocaleString('es-CO', {minimumFractionDigits:dec||0,
                                      maximumFractionDigits:dec||0});
  return String(v);
}

/* filas de una fuente (tabla.json / ficha.json) resolviendo catalogo */
function filasDe(fuente, i, omitir, solo){
  const r = [];
  if(!fuente || !fuente.filas) return r;
  const fila = fuente.filas[i];
  if(!fila) return r;
  const cat = fuente.catalogo || {};

  fuente.campos.forEach((c, j) => {
    if(omitir && omitir.indexOf(c.key) >= 0) return;
    if(solo && solo.indexOf(c.key) < 0) return;
    let v = fila[j];
    if(v === null || v === undefined || v === '') return;
    if(cat[c.key]) v = cat[c.key][v];
    if(v === null || v === undefined || v === '') return;
    if(c.key === 'etapa')   v = ETAPAS[v] || v;
    if(c.key === 'ini')     v = v ? 'Sí' : 'No';
    if(c.key === 'entrega') v = v === 1 ? 'Primera' : (v === 2 ? 'Segunda' : v);
    const t = fmt(v, c.dec);
    if(t !== null) r.push([c.label, t]);
  });
  return r;
}

function valorDe(fuente, i, key){
  if(!fuente || !fuente.filas) return null;
  const j = fuente.campos.findIndex(c => c.key === key);
  if(j < 0) return null;
  const fila = fuente.filas[i];
  if(!fila) return null;
  let v = fila[j];
  const cat = fuente.catalogo || {};
  if(cat[key] && v !== null && v !== undefined) v = cat[key][v];
  return v;
}

function abrirFicha(i, desdeConstruccion){
  const fila = S.tabla.filas[i];
  if(!fila) return;
  S.seleccion = i;
  if(!desdeConstruccion){
    S.selTipo = 'predio';
    resaltarSeleccion({tipo:'predio', i:i});
    document.getElementById('ficha-c').classList.remove('abierta');
    S.ultimaConstr = null;
  }

  const est = S.val(fila, 'estado');
  const info = ESTADOS[est] || {label:est, color:'#888'};

  const area = valorDe(S.ficha, i, 'area_terr');
  const cons = valorDe(S.ficha, i, 'area_const');
  const uni  = valorDe(S.ficha, i, 'n_unid');

  const destacados = [];
  if(area != null) destacados.push(['Terreno m²', fmt(area, 0)]);
  if(cons != null) destacados.push(['Construido m²', fmt(cons, 0)]);
  if(uni  != null) destacados.push(['Construcciones', fmt(uni, 0)]);

  pintarFicha({
    rotulo:'Predio',
    titulo:fila[S.col.npn],
    acento:info.color,
    chip:{texto:info.label, color:info.color},
    destacados:destacados.slice(0, 3),
    grupos:[
      {titulo:'Ubicación', color:'#4cc2ff',
       filas:filasDe(S.tabla, i, null, ['uit','barrio'])
              .concat(filasDe(S.ficha, i, null, ['manzana','direccion']))},
      {titulo:'Avance', color:info.color,
       filas:filasDe(S.tabla, i, ['npn','estado','uit','barrio'])},
      {titulo:'Características', color:'#8ea3b6',
       filas:filasDe(S.ficha, i, ['manzana','direccion','area_terr',
                                  'area_const','n_unid','estado'])}
    ]
  }, 'f');
  acomodarFichas();
  marcarFilaTabla(i);
}

function cerrarFicha(){
  document.getElementById('ficha').classList.remove('abierta');
  document.getElementById('ficha-c').classList.remove('abierta');
  acomodarFichas();
  capaResalte.clearLayers();
  S.seleccion = null;
  S.selTipo = null;
  S.ultimaConstr = null;
  acomodarFichas();
  marcarFilaTabla(null);
}
document.getElementById('f-cerrar').onclick = cerrarFicha;

document.addEventListener('keydown', e => {

/* ══════════ FICHA DE CONSTRUCCION ══════════
   Los atributos viajan dentro del propio poligono, asi que abrirla
   no dispara ninguna consulta.                                     */

const CAMPOS_CONSTR = [
  ['d', 'Identificador'],
  ['p', 'Planta'],
  ['t', 'Tipo de unidad'],
  ['u', 'Uso'],
  ['n', 'Pisos'],
  ['q', 'Puntaje'],
  ['x', 'Tipo de anexo']
];

function abrirFichaConstruccion(f){
  const pr = f.properties;
  const i = pr.i;
  const fila = S.tabla.filas[i];
  if(!fila) return;
  S.ultimaConstr = f;

  const conv = pr.c === 0
    ? {t:'No convencional', c:'#ff5252'}
    : {t:'Convencional',    c:'#4a9eff'};

  // el area es la del poligono dibujado: es el dato del levantamiento
  const destacados = [];
  if(pr.m != null) destacados.push(['Área m²', fmt(pr.m, 1)]);
  if(pr.n != null) destacados.push(['Pisos', fmt(pr.n, 0)]);
  if(pr.q != null) destacados.push(['Puntaje', fmt(pr.q, 0)]);

  const propias = [];
  if(pr.m != null) propias.push(['Área del polígono (m²)', fmt(pr.m, 2)]);
  for(const [k, label] of CAMPOS_CONSTR){
    const t = fmt(pr[k]);
    if(t !== null) propias.push([label, t]);
  }
  if(pr.t == null && pr.u == null){
    propias.push(['Calificación', 'sin datos alfanuméricos']);
  }

  pintarFicha({
    rotulo:'Construcción' + (pr.d ? ' · ' + pr.d : ''),
    titulo:fila[S.col.npn],
    acento:conv.c,
    chip:{texto:conv.t, color:conv.c},
    destacados:destacados.slice(0, 3),
    grupos:[{titulo:'Datos de la construcción', color:conv.c, filas:propias}]
  }, 'c');

  // el predio se abre en su propio panel: los dos se ven a la vez
  abrirFicha(i, true);
  S.selTipo = 'construccion';
  resaltarSeleccion({tipo:'construccion', i:i, feature:f, conv:pr.c});
  acomodarFichas();
}

/* Las dos fichas comparten la columna derecha: si estan abiertas a la
   vez se reparten la altura. La barra de la derecha refleja cual esta
   visible y permite abrirla o cerrarla como los cajones de la izquierda. */
function acomodarFichas(){
  const a = document.getElementById('ficha');
  const b = document.getElementById('ficha-c');
  const va = a.classList.contains('abierta');
  const vb = b.classList.contains('abierta');
  a.classList.toggle('doble', va && vb);
  b.classList.toggle('bajo',  va && vb);

  const bp = document.getElementById('b-predio');
  const bc = document.getElementById('b-constr');
  bp.classList.toggle('on', va);
  bc.classList.toggle('on', vb);
  bp.disabled = (S.seleccion === null);
  bc.disabled = !S.ultimaConstr;
  bp.style.opacity = bp.disabled ? .35 : 1;
  bc.style.opacity = bc.disabled ? .35 : 1;
}

document.getElementById('b-predio').onclick = () => {
  const f = document.getElementById('ficha');
  if(f.classList.contains('abierta')) f.classList.remove('abierta');
  else if(S.seleccion !== null) abrirFicha(S.seleccion, true);
  acomodarFichas();
};

document.getElementById('b-constr').onclick = () => {
  const f = document.getElementById('ficha-c');
  if(f.classList.contains('abierta')) cerrarFichaConstruccion();
  else if(S.ultimaConstr) abrirFichaConstruccion(S.ultimaConstr);
};

function cerrarFichaConstruccion(){
  document.getElementById('ficha-c').classList.remove('abierta');
  acomodarFichas();
  if(S.selTipo === 'construccion' && S.seleccion !== null){
    S.selTipo = 'predio';
    resaltarSeleccion({tipo:'predio', i:S.seleccion});
  }
}
document.getElementById('fc-cerrar').onclick = cerrarFichaConstruccion;

/* ══════════ RESALTADO ══════════
   Se resalta exactamente lo que se selecciono: si el clic fue en una
   construccion, solo esa construccion; si fue en el punto del predio,
   el punto y su lote.                                              */

function resaltarSeleccion(sel){
  capaResalte.clearLayers();
  if(!sel) return;

  if(sel.tipo === 'construccion'){
    const col = sel.conv === 0 ? '#ff5252' : '#4a9eff';
    L.geoJSON(sel.feature, {pane:'resalte', interactive:false,
      style:{color:'#ffffff', weight:3.5, opacity:.9,
             fillColor:col, fillOpacity:.35}}).addTo(capaResalte);
    L.geoJSON(sel.feature, {pane:'resalte', interactive:false,
      style:{color:col, weight:1.8, opacity:1, fill:false}}).addTo(capaResalte);
    return;
  }

  // predio: el punto y, si esta cargado, su lote
  const p = S.porFila.get(sel.i);
  if(p){
    L.circleMarker([p.y, p.x], {
      pane:'resalte', radius:11, color:'#4cc2ff', weight:2.5,
      fillColor:'#4cc2ff', fillOpacity:.2, interactive:false
    }).addTo(capaResalte);
  }
  const P = S.poli.terrenos;
  if(!P || !map.hasLayer(P.capa)) return;
  P.capa.eachLayer(l => {
    if(!l.feature || l.feature.properties.i !== sel.i) return;
    L.geoJSON(l.feature, {pane:'resalte', interactive:false,
      style:{color:'#4cc2ff', weight:3, opacity:.95,
             fillColor:'#4cc2ff', fillOpacity:.16}}).addTo(capaResalte);
  });
}

const COLS = ['npn','barrio','uit','estado','etapa'];
const ANCHOS = {npn:'34%', barrio:'26%', uit:'12%', estado:'16%', etapa:'12%'};
const scroll = document.getElementById('scroll');
const tbody = document.getElementById('tbody');
let listaTabla = [];

function pintarEncabezadoTabla(){
  const th = document.getElementById('thead');
  th.innerHTML = '';
  for(const k of COLS){
    const c = S.tabla.campos.find(x => x.key === k) || {label:k};
    const t = document.createElement('th');
    t.style.width = ANCHOS[k] || 'auto';
    t.dataset.k = k;
    t.innerHTML = c.label + '<span class="flecha"></span>';
    t.onclick = () => {
      S.orden = {campo:k, asc: S.orden.campo === k ? !S.orden.asc : true};
      pintarTabla();
    };
    th.appendChild(t);
  }
}

function pintarTabla(){
  if(!document.getElementById('gaveta').classList.contains('abierta')) return;

  let base;
  if(S.ambito === 'vis' && map.getZoom() >= CFG.zoomPuntos){
    const b = map.getBounds();
    base = S.indice.search({minX:b.getWest(), minY:b.getSouth(),
                            maxX:b.getEast(), maxY:b.getNorth()})
             .map(it => it.p.i).filter(enFiltro);
  }else{
    base = S.visibles === null
      ? S.tabla.filas.map((_,i) => i)
      : Array.from(S.visibles);
  }
  if(S.ocultos.size){
    base = base.filter(i => !S.ocultos.has(S.val(S.tabla.filas[i],'estado')));
  }

  const k = S.orden.campo, dir = S.orden.asc ? 1 : -1;
  base.sort((a,b) => {
    const va = S.val(S.tabla.filas[a], k), vb = S.val(S.tabla.filas[b], k);
    const xa = va === null || va === undefined ? '' : va;
    const xb = vb === null || vb === undefined ? '' : vb;
    return xa < xb ? -dir : (xa > xb ? dir : 0);
  });

  listaTabla = base;
  document.getElementById('g-cuenta').textContent = nf(base.length) + ' predios';

  const ths = document.querySelectorAll('#thead th');
  for(const t of ths){
    t.querySelector('.flecha').textContent =
      t.dataset.k === k ? (S.orden.asc ? '▲' : '▼') : '';
  }

  scroll.scrollTop = 0;
  render();
}

scroll.addEventListener('scroll', () => requestAnimationFrame(render));

function render(){
  const alto = CFG.filaAlto;
  const total = listaTabla.length;
  const desde = Math.max(0, Math.floor(scroll.scrollTop / alto) - 6);
  const hasta = Math.min(total, desde + Math.ceil(scroll.clientHeight / alto) + 12);
  const arriba = desde * alto;
  const abajo = Math.max(0, (total - hasta) * alto);

  let html = arriba ? '<tr style="height:' + arriba + 'px"><td colspan="5"></td></tr>' : '';
  for(let n = desde; n < hasta; n++){
    const i = listaTabla[n];
    const f = S.tabla.filas[i];
    const est = S.val(f,'estado');
    const col = (ESTADOS[est] || {}).color || '#888';
    const etapa = S.val(f,'etapa');
    html += '<tr data-i="' + i + '"' + (i === S.seleccion ? ' class="sel"' : '') + '>'
      + '<td class="mono">' + f[S.col.npn] + '</td>'
      + '<td>' + (S.val(f,'barrio') || '') + '</td>'
      + '<td>' + (S.val(f,'uit') || '') + '</td>'
      + '<td><span class="punto-est" style="background:' + col + '"></span>'
      + ((ESTADOS[est] || {}).label || est || '') + '</td>'
      + '<td>' + (ETAPAS[etapa] || '') + '</td></tr>';
  }
  if(abajo) html += '<tr style="height:' + abajo + 'px"><td colspan="5"></td></tr>';
  tbody.innerHTML = html;
}

tbody.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]');
  if(!tr) return;
  const i = +tr.dataset.i;
  abrirFicha(i);
  const p = S.porFila.get(i);
  if(p) map.flyTo([p.y,p.x], Math.max(map.getZoom(), 18), {duration:.6});
});

tbody.addEventListener('mouseover', e => {
  const tr = e.target.closest('tr[data-i]');
  if(tr) previsualizar(+tr.dataset.i);
});
tbody.addEventListener('mouseleave', () => {
  capaVista.clearLayers();
});

/* al pasar el mouse por una fila se marca el predio en el mapa,
   sin tocar la seleccion actual */
function previsualizar(i){
  capaVista.clearLayers();
  const p = S.porFila.get(i);
  if(!p) return;
  L.circleMarker([p.y, p.x], {
    pane:'resalte', radius:10, color:'#ffffff', weight:2,
    fillColor:'#4cc2ff', fillOpacity:.35, interactive:false
  }).addTo(capaVista);
}

function marcarFilaTabla(i){
  const previas = tbody.querySelectorAll('tr.sel');
  for(const t of previas) t.classList.remove('sel');
  if(i === null) return;
  const tr = tbody.querySelector('tr[data-i="' + i + '"]');
  if(tr){ tr.classList.add('sel'); return; }
  const n = listaTabla.indexOf(i);
  if(n >= 0){
    scroll.scrollTop = Math.max(0, n*CFG.filaAlto - scroll.clientHeight/2);
    render();
  }
}

const gaveta = document.getElementById('gaveta');
function abrirGaveta(){
  gaveta.classList.add('abierta');
  document.getElementById('b-tabla').classList.add('on');
  document.documentElement.style.setProperty('--gaveta','290px');
  setTimeout(() => map.invalidateSize(), 240);
  pintarTabla();
}
function cerrarGaveta(){
  gaveta.classList.remove('abierta');
  document.getElementById('b-tabla').classList.remove('on');
  document.documentElement.style.setProperty('--gaveta','0px');
  setTimeout(() => map.invalidateSize(), 240);
}
document.getElementById('b-tabla').onclick = () => {
  const g = document.getElementById('gaveta');
  g.classList.contains('abierta') ? cerrarGaveta() : abrirGaveta();
};
document.getElementById('g-cerrar').onclick = cerrarGaveta;

document.getElementById('g-todos').onclick = function(){
  S.ambito = 'todos';
  this.classList.add('on');
  document.getElementById('g-vis').classList.remove('on');
  pintarTabla();
};
document.getElementById('g-vis').onclick = function(){
  S.ambito = 'vis';
  this.classList.add('on');
  document.getElementById('g-todos').classList.remove('on');
  pintarTabla();
};

document.getElementById('g-csv').onclick = () => {
  const cab = COLS.map(k => (S.tabla.campos.find(c => c.key === k) || {label:k}).label);
  const lin = [cab.join(';')];
  for(const i of listaTabla){
    const f = S.tabla.filas[i];
    lin.push(COLS.map(k => {
      let v = k === 'npn' ? f[S.col.npn] : S.val(f,k);
      if(k === 'estado') v = (ESTADOS[v] || {}).label || v;
      if(k === 'etapa')  v = ETAPAS[v] || v;
      return v == null ? '' : String(v).replace(/;/g, ',');
    }).join(';'));
  }
  const blob = new Blob(['\uFEFF' + lin.join('\r\n')],
                        {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'predios_' + S.resumen.corte + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ── capas ── */
function filaCapa(label, color, capa, activa, n, alCambiar){
  const div = document.createElement('label');
  div.className = 'fila-capa';
  div.innerHTML = '<input type="checkbox"' + (activa ? ' checked' : '') + '>'
    + (color ? '<span class="pin" style="background:' + color + '"></span>' : '')
    + '<span>' + label + '</span>'
    + (n != null ? '<span class="n mono">' + nf(n) + '</span>' : '');
  div.querySelector('input').onchange = e => {
    if(alCambiar) return alCambiar(e.target.checked);
    if(!capa) return;
    if(e.target.checked) capa.addTo(map); else map.removeLayer(capa);
  };
  return div;
}

function pintarCapas(){
  const c = document.getElementById('lista-capas');
  c.appendChild(filaCapa('Ortofoto', null, orto, true));
  c.appendChild(filaCapa('Calles y nombres', null, etiquetas, true));
}

const EST_ZONA = {
  perimetro:{color:'#ffffff', weight:3,   opacity:.95, fillOpacity:0,
             dashArray:'9,6', halo:'#080d12'},
  uit:      {color:'#4cc2ff', weight:2.4, opacity:.9,  fillOpacity:.05},
  barrios:  {color:'#ffd166', weight:1.7, opacity:.8,  fillOpacity:.06}
};

async function cargarZonas(){
  const cont = document.getElementById('lista-capas');
  const defs = [
    {a:'contexto/perimetro.geojson', l:'Perímetro urbano', k:'perimetro',
     campo:'Nombre', on:true, halo:true},
    {a:'contexto/uit.geojson', l:'Unidades de intervención', k:'uit',
     campo:'Nombre', on:true, filtro:'uit'},
    {a:'contexto/barrios.geojson', l:'Barrios', k:'barrios',
     campo:'NOMBRE', on:true, filtro:'barrio'}
  ];

  for(const d of defs){
    const geo = await traer(d.a, false);
    if(!geo) continue;
    const est = EST_ZONA[d.k];

    // halo oscuro debajo: hace legible la línea sobre la ortofoto
    if(d.halo){
      const h = L.geoJSON(geo,{pane:'zonas', interactive:false,
        style:{color:est.halo, weight:est.weight + 3, opacity:.45, fillOpacity:0}});
      if(d.on) h.addTo(map);
    }

    const capa = L.geoJSON(geo,{
      pane:'zonas',
      style:{color:est.color, weight:est.weight, opacity:est.opacity,
             fillColor:est.color, fillOpacity:est.fillOpacity,
             dashArray:est.dashArray},
      onEachFeature:(f,l) => {
        const nombre = f.properties ? f.properties[d.campo] : null;
        if(nombre) l.bindTooltip(String(nombre), {sticky:true, className:'zona'});
        if(!d.filtro) return;

        l.on('mouseover', () => l.setStyle({weight:est.weight + 1.4,
                                            fillOpacity:.16, opacity:1}));
        l.on('mouseout', () => {
          if(S.filtros[d.filtro] === String(nombre)) return;
          l.setStyle({weight:est.weight, fillOpacity:est.fillOpacity,
                      opacity:est.opacity, color:est.color});
        });
        l.on('contextmenu', ev => {
          L.DomEvent.stop(ev);
          const val = String(nombre);
          const nuevo = S.filtros[d.filtro] === val ? '' : val;
          S.filtros[d.filtro] = nuevo;
          const sel = document.getElementById('f-' + d.filtro);
          if(sel) sel.value = nuevo;
          aplicarFiltros();
          if(nuevo) volarAZona(d.filtro, nuevo); else quitarZona();
        });
      }
    });
    if(d.on) capa.addTo(map);
    if(d.filtro) S.zonas[d.filtro] = {capa:capa, campo:d.campo, est:est};

    cont.appendChild(filaCapa(d.l, est.color, capa, d.on,
                              geo.features ? geo.features.length : null));
  }
  await cargarCalidad();
}

function volarAZona(tipo, valor){
  quitarZona();
  const ref = S.zonas[tipo];
  if(!ref || !valor) return;

  // Un mismo nombre puede estar en varios poligonos, a veces en zonas
  // separadas de la ciudad. Encuadrar la union daria una vista que
  // abarca todo y parece un salto al centro: se vuela al poligono mas
  // grande, que es el principal, aunque se resalten todos.
  let mejor = null, mayor = -1;
  ref.capa.eachLayer(l => {
    if(String(l.feature.properties[ref.campo]) !== valor) return;
    l.setStyle({weight:ref.est.weight + 2, opacity:1, fillOpacity:.14,
                color:'#4cc2ff'});
    l.bringToFront();
    const b = l.getBounds();
    const a = (b.getEast() - b.getWest()) * (b.getNorth() - b.getSouth());
    if(a > mayor){ mayor = a; mejor = b; }
  });
  if(mejor) encuadrar(mejor);
}

/* Encuadra una zona dejándola visible entre los paneles.
   Los paneles flotan sobre el mapa, así que el centro geométrico
   no es el centro visible: el padding se calcula por lado. */
function encuadrar(caja){
  // el padding se calcula con lo que hay abierto en ese momento
  const izq = 56 + (S.cajon ? 300 : 0);
  const anchoPanelIzq = Math.min(izq, window.innerWidth * .45);
  const anchoPanelDer = document.getElementById('ficha')
                          .classList.contains('abierta') ? 330 : 40;
  const alturaGaveta = document.getElementById('gaveta')
                         .classList.contains('abierta') ? 60 : 40;

  S.volando = true;
  map.flyToBounds(caja, {
    paddingTopLeft:     [anchoPanelIzq, 40],
    paddingBottomRight: [anchoPanelDer, alturaGaveta],
    duration: .85,
    easeLinearity: .25
  });
}

function quitarZona(){
  for(const t in S.zonas){
    const ref = S.zonas[t];
    ref.capa.eachLayer(l => l.setStyle({
      color:ref.est.color, weight:ref.est.weight,
      opacity:ref.est.opacity, fillOpacity:ref.est.fillOpacity}));
  }
}

async function cargarCalidad(){
  const man = await traer('../opcionales/manifiesto.json', false)
           || await traer('manifiesto.json', false);
  const cont = document.getElementById('lista-calidad');
  if(!man || !man.opcionales){
    cont.innerHTML = '<div style="font-size:11.5px;color:var(--texto-3)">'
      + 'Sin capas de revisión en este corte.</div>';
    return;
  }
  for(const o of man.opcionales){
    if(o.tipo !== 'geojson'){
      const d = document.createElement('div');
      d.className = 'fila-capa';
      d.style.cursor = 'default';
      d.innerHTML = '<span class="pin" style="background:' + o.color
        + ';opacity:.5"></span><span title="' + o.desc + '">' + o.label
        + '</span><span class="n mono">' + nf(o.n) + '</span>';
      cont.appendChild(d);
      continue;
    }
    const geo = await traer('../opcionales/' + o.archivo, false)
             || await traer(o.archivo, false);
    if(!geo) continue;
    const capa = L.geoJSON(geo,{
      pane:'calidad',
      style:{color:o.color, weight:1.5, fillColor:o.color, fillOpacity:.22},
      onEachFeature:(f,l) => l.bindTooltip(
        o.label + '<br><span class="mono">'
        + (f.properties.npn || f.properties.cons || '') + '</span>',
        {className:'zona'})
    });
    cont.appendChild(filaCapa(o.label, o.color, capa, false,
                              geo.features ? geo.features.length : o.n));
  }
}
