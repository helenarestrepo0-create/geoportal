<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance catastral · Valledupar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/rbush@4.0.1/rbush.min.js"></script>
<script src="https://unpkg.com/flatgeobuf@3.36.0/dist/flatgeobuf-geojson.min.js"></script>

<style>
:root{
  --tinta:#0e141a;
  --tinta-2:#18222b;
  --linea:#2b3844;
  --linea-2:#3a4a58;
  --texto:#e8eff5;
  --texto-2:#8ea3b6;
  --texto-3:#5f7386;
  --foco:#4cc2ff;
  --entregado:#22c55e;
  --listo:#38bdf8;
  --proceso:#f5a524;
  --gaveta:0px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:14px/1.45 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--texto); background:#080d12; -webkit-font-smoothing:antialiased;
}
#mapa{position:absolute;top:0;left:0;right:0;bottom:var(--gaveta);background:#080d12;
      transition:bottom .22s cubic-bezier(.4,0,.2,1)}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      font-variant-numeric:tabular-nums}
button{font:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}

.panel{
  position:absolute;z-index:600;background:rgba(14,20,26,.95);
  border:1px solid var(--linea);border-radius:5px;
  backdrop-filter:blur(8px);box-shadow:0 10px 32px rgba(0,0,0,.6);
}

#cabecera{top:12px;left:12px;width:296px;padding:14px 17px 13px}
#cabecera h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:-.01em}
#cabecera .sub{color:var(--texto-2);font-size:11.5px;margin-bottom:13px}
.cifra{display:flex;align-items:baseline;gap:9px}
.cifra .n{font-size:33px;font-weight:600;letter-spacing:-.03em;line-height:1}
.cifra .pct{font-size:14px;color:var(--entregado);font-weight:600}
.cifra-pie{color:var(--texto-2);font-size:11.5px;margin:3px 0 13px}
.medidor{height:5px;background:#101a22;border-radius:3px;overflow:hidden;
         display:flex;margin-bottom:13px}
.medidor i{display:block;height:100%;transition:width .25s ease}
table.tot{width:100%;border-collapse:collapse;font-size:12.5px}
table.tot td{padding:3.5px 0;border:0}
table.tot td:last-child{text-align:right}
table.tot tr{cursor:pointer;transition:opacity .15s}
table.tot tr:hover td{color:#fff}
table.tot tr.off{opacity:.3}
.marca{display:inline-block;width:9px;height:9px;border-radius:2px;
       margin-right:8px;vertical-align:-1px}
.divisor{height:1px;background:var(--linea);margin:12px 0 11px}
.dual{font-size:11.5px;color:var(--texto-2);line-height:1.75}
.dual b{color:var(--texto);font-weight:600}

#filtros{top:12px;left:320px;width:262px;padding:13px 15px 14px}
#filtros .titulo{font-size:11px;color:var(--texto-2);margin-bottom:10px}
.campo{margin-bottom:9px}
.campo label{display:block;font-size:11px;color:var(--texto-3);margin-bottom:3px}
.campo select,.campo input{
  width:100%;background:#0a1016;border:1px solid var(--linea);color:var(--texto);
  border-radius:4px;padding:6px 9px;font-size:12.5px;transition:border-color .15s;
}
.campo select:hover,.campo input:hover{border-color:var(--linea-2)}
.campo select:focus,.campo input:focus{border-color:var(--foco);outline:none}
.campo input::placeholder{color:var(--texto-3)}
#buscar-wrap{position:relative}
#sugerencias{
  position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:3px;
  background:var(--tinta);border:1px solid var(--linea-2);border-radius:4px;
  max-height:210px;overflow-y:auto;display:none;box-shadow:0 8px 22px rgba(0,0,0,.6);
}
#sugerencias.abierto{display:block}
.sug{padding:7px 10px;cursor:pointer;font-size:12px;
     border-bottom:1px solid rgba(43,56,68,.6)}
.sug:last-child{border:0}
.sug:hover,.sug.activo{background:var(--tinta-2)}
.sug .meta{color:var(--texto-3);font-size:10.5px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip-f{display:inline-flex;align-items:center;gap:6px;background:var(--tinta-2);
        border:1px solid var(--linea-2);border-radius:12px;
        padding:3px 5px 3px 10px;font-size:11px}
.chip-f button{background:none;border:0;color:var(--texto-2);cursor:pointer;
               font-size:14px;line-height:1;padding:0 3px}
.chip-f button:hover{color:#fff}
#resultado{margin-top:11px;padding-top:11px;border-top:1px solid var(--linea);
           font-size:12px;color:var(--texto-2);line-height:1.7}
#resultado b{color:var(--texto);font-weight:600}
#resultado .grande{font-size:19px;font-weight:600;color:var(--texto);
                   letter-spacing:-.02em}

#capas{bottom:calc(var(--gaveta) + 12px);left:12px;width:250px;
       padding:11px 14px 12px;transition:bottom .22s cubic-bezier(.4,0,.2,1)}
#capas .titulo{font-size:11px;color:var(--texto-2);margin-bottom:8px}
.fila-capa{display:flex;align-items:center;gap:9px;padding:4px 0;
           cursor:pointer;font-size:12.5px;user-select:none}
.fila-capa:hover{color:#fff}
.fila-capa input{accent-color:var(--foco);margin:0;cursor:pointer}
.fila-capa .n{margin-left:auto;color:var(--texto-3);font-size:11px}
.pin{width:9px;height:9px;border-radius:2px;flex:none}
#capas details{margin-top:7px}
#capas summary{cursor:pointer;font-size:11px;color:var(--texto-2);padding:3px 0}
#capas summary:hover{color:var(--texto)}
.aviso{font-size:11px;color:var(--proceso);line-height:1.5;margin:7px 0 4px}

#ficha{top:12px;right:12px;width:306px;
       max-height:calc(100vh - var(--gaveta) - 24px);
       padding:0;display:none;overflow:hidden;flex-direction:column}
#ficha.abierta{display:flex}
#ficha .cab{padding:12px 15px 11px;border-bottom:1px solid var(--linea);
            display:flex;align-items:flex-start;gap:10px}
#ficha .npn{font-size:13px;word-break:break-all;line-height:1.4}
#ficha .cerrar{margin-left:auto;background:none;border:0;color:var(--texto-2);
               font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
#ficha .cerrar:hover{color:#fff}
#ficha .cuerpo{padding:4px 15px 15px;overflow-y:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;
      font-weight:600;margin:9px 0 2px}
dl.attr{margin:0;font-size:12.5px}
dl.attr div{display:flex;gap:10px;padding:5px 0;
            border-bottom:1px solid rgba(43,56,68,.5)}
dl.attr dt{color:var(--texto-2);flex:0 0 44%;font-size:11.5px}
dl.attr dd{margin:0;flex:1;text-align:right;word-break:break-word}

#gaveta{position:absolute;left:0;right:0;bottom:0;z-index:700;height:0;
        background:rgba(14,20,26,.97);border-top:1px solid var(--linea);
        display:flex;flex-direction:column;backdrop-filter:blur(8px);
        transition:height .22s cubic-bezier(.4,0,.2,1)}
#gaveta.abierta{height:290px}
#gaveta .barra{display:flex;align-items:center;gap:13px;padding:9px 14px;
               border-bottom:1px solid var(--linea);flex:none}
#gaveta .barra .tit{font-size:12.5px;font-weight:600}
#gaveta .barra .cuenta{color:var(--texto-2);font-size:11.5px}
.seg{display:flex;background:#0a1016;border:1px solid var(--linea);border-radius:4px}
.seg button{background:none;border:0;color:var(--texto-2);padding:4px 12px;
            font-size:11.5px;cursor:pointer;border-radius:3px;transition:.12s}
.seg button.on{background:var(--tinta-2);color:var(--texto)}
.seg button:hover{color:var(--texto)}
.btn{background:#0a1016;border:1px solid var(--linea);color:var(--texto-2);
     border-radius:4px;padding:4px 11px;font-size:11.5px;cursor:pointer;
     transition:.12s}
.btn:hover{border-color:var(--linea-2);color:var(--texto)}
#g-cerrar{margin-left:auto;background:none;border:0;color:var(--texto-2);
          font-size:19px;cursor:pointer;line-height:1;padding:0 4px}
#g-cerrar:hover{color:#fff}
#scroll{flex:1;overflow-y:auto;position:relative}
#tabla{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
#tabla thead th{position:sticky;top:0;z-index:2;background:#141d25;text-align:left;
  font-weight:600;font-size:11px;color:var(--texto-2);padding:7px 11px;
  border-bottom:1px solid var(--linea);cursor:pointer;white-space:nowrap;
  user-select:none}
#tabla thead th:hover{color:var(--texto)}
#tabla thead th .flecha{opacity:.45;margin-left:4px;font-size:9px}
#tabla td{padding:5px 11px;border-bottom:1px solid rgba(43,56,68,.35);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabla tbody tr{cursor:pointer}
#tabla tbody tr:hover{background:rgba(76,194,255,.09)}
#tabla tbody tr.sel{background:rgba(76,194,255,.16)}
.punto-est{display:inline-block;width:7px;height:7px;border-radius:50%;
           margin-right:7px;vertical-align:0}
#abrir-tabla{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
             z-index:600;padding:7px 17px;font-size:12px}
#gaveta.abierta ~ #abrir-tabla{display:none}

#estado{bottom:calc(var(--gaveta) + 12px);right:12px;padding:7px 13px;
        font-size:11.5px;color:var(--texto-2);
        transition:bottom .22s cubic-bezier(.4,0,.2,1)}
#estado b{color:var(--texto);font-weight:600}

#carga{position:absolute;inset:0;z-index:1200;display:flex;align-items:center;
       justify-content:center;flex-direction:column;gap:13px;background:#080d12;
       color:var(--texto-2);font-size:13px}
#carga .barra{width:190px;height:2px;background:#1a242e;overflow:hidden}
#carga .barra i{display:block;height:100%;width:38%;background:var(--foco);
                animation:desliza 1.05s ease-in-out infinite}
@keyframes desliza{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}

.tt-predio{position:absolute;z-index:650;pointer-events:none;display:none;
  background:rgba(14,20,26,.96);border:1px solid var(--linea-2);border-radius:4px;
  padding:6px 10px;font-size:11.5px;line-height:1.5;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.55)}
.tt-predio .e{font-size:10.5px;color:var(--texto-2)}

.leaflet-control-attribution{background:rgba(14,20,26,.85)!important;
  color:var(--texto-3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:#7fb4d6!important}
.leaflet-control-zoom a{background:rgba(14,20,26,.95)!important;
  color:var(--texto)!important;border-color:var(--linea)!important}
.leaflet-control-zoom a:hover{background:var(--tinta-2)!important}
.leaflet-control-scale-line{background:rgba(14,20,26,.8)!important;
  color:var(--texto)!important;border-color:var(--linea)!important}
.leaflet-tooltip.zona{background:rgba(14,20,26,.95);border:1px solid var(--linea-2);
  color:var(--texto);font-size:11.5px;box-shadow:none}
.leaflet-tooltip.zona::before{display:none}

@media (max-width:1000px){
  #filtros{left:12px;top:auto;bottom:calc(var(--gaveta) + 12px);width:296px}
  #capas{display:none}
}
@media (max-width:720px){
  #cabecera{width:auto;right:12px}
  #filtros{right:12px;width:auto}
  #ficha{top:auto;bottom:calc(var(--gaveta) + 12px);left:12px;right:12px;
         width:auto;max-height:46vh}
  #estado{display:none}
  #gaveta.abierta{height:230px}
}
</style>
</head>
<body>

<div id="mapa"></div>
<div class="tt-predio" id="tt"></div>

<div id="carga">
  <div>Cargando predios…</div>
  <div class="barra"><i></i></div>
  <div id="carga-detalle" style="font-size:11.5px;color:#5f7386"></div>
</div>

<div class="panel" id="cabecera">
  <h1>Avance de actualización catastral</h1>
  <div class="sub" id="sub">Valledupar · corte —</div>
  <div class="cifra">
    <span class="n mono" id="c-entregado">—</span>
    <span class="pct mono" id="c-pct"></span>
  </div>
  <div class="cifra-pie">predios entregados</div>
  <div class="medidor" id="medidor"></div>
  <table class="tot"><tbody id="totales"></tbody></table>
  <div class="divisor"></div>
  <div class="dual" id="dual"></div>
</div>

<div class="panel" id="filtros">
  <div class="titulo">Filtrar</div>
  <div class="campo" id="buscar-wrap">
    <label for="q">Buscar predio, barrio o manzana</label>
    <input id="q" type="search" placeholder="NPN, nombre o manzana" autocomplete="off">
    <div id="sugerencias"></div>
  </div>
  <div class="campo">
    <label for="f-uit">Unidad de intervención</label>
    <select id="f-uit"><option value="">Todas</option></select>
  </div>
  <div class="campo">
    <label for="f-barrio">Barrio</label>
    <select id="f-barrio"><option value="">Todos</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="resultado"></div>
</div>

<div class="panel" id="capas">
  <div class="titulo">Capas</div>
  <div id="lista-capas"></div>
  <details id="det-calidad">
    <summary>Revisión de calidad</summary>
    <div class="aviso">No cuentan en el avance. Revísalas antes de publicar.</div>
    <div id="lista-calidad"></div>
  </details>
</div>

<div class="panel" id="ficha">
  <div class="cab">
    <div>
      <div style="font-size:11px;color:var(--texto-2)">Predio</div>
      <div class="npn mono" id="f-npn"></div>
    </div>
    <button class="cerrar" id="f-cerrar" aria-label="Cerrar ficha">×</button>
  </div>
  <div class="cuerpo">
    <span class="chip" id="f-chip"></span>
    <dl class="attr" id="f-attr"></dl>
  </div>
</div>

<button class="panel btn" id="abrir-tabla">Ver tabla de predios</button>

<div id="gaveta">
  <div class="barra">
    <span class="tit">Predios</span>
    <span class="cuenta mono" id="g-cuenta">—</span>
    <div class="seg">
      <button id="g-todos" class="on">Todos</button>
      <button id="g-vis">En pantalla</button>
    </div>
    <button class="btn" id="g-csv">Exportar CSV</button>
    <button id="g-cerrar" aria-label="Cerrar tabla">×</button>
  </div>
  <div id="scroll">
    <table id="tabla">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="panel" id="estado">
  <b id="e-vis">0</b> en pantalla · zoom <b id="e-zoom">14</b>
</div>

<script>
"use strict";

const CFG = {
  datos:'data/',
  orto:'https://xyz1.falconprecision.co/valledupar-urbano/Z{z}/{y}/{x}.png',
  centro:[10.4631,-73.2532], zoom:14,
  limites:[[10.38,-73.32],[10.55,-73.18]],
  zoomPuntos:15,
  filaAlto:26
};

const ESTADOS = {
  ENTREGADO:  {label:'Entregado',      color:'#22c55e'},
  LISTO:      {label:'Listo para SIG', color:'#38bdf8'},
  EN_PROCESO: {label:'En proceso',     color:'#f5a524'},
  ERROR_ETAPA:{label:'Error de etapa', color:'#f4426c'},
  CANCELADO:  {label:'Cancelado',      color:'#7c8b99'},
  SIN_MATRIZ: {label:'Sin matriz',     color:'#a78bfa'}
};
const ETAPAS = {juridico:'Jurídico', reconocimiento:'Reconocimiento',
                geografico:'Geográfico'};

const nf = n => (n||0).toLocaleString('es-CO');
const pf = n => n.toFixed(1).replace('.',',');

const S = {
  tabla:null, ficha:null, resumen:null, dominios:{},
  puntos:[], indice:null,
  porFila:new Map(), col:{}, val:null,
  idx:{},
  filtros:{uit:'', barrio:'', manzana:''},
  ocultos:new Set(),
  visibles:null,
  seleccion:null, hover:null,
  ambito:'todos',
  orden:{campo:'npn', asc:true},
  zonas:{}, poli:{}, volando:false
};

/* ── mapa ── */
const map = L.map('mapa',{
  center:CFG.centro, zoom:CFG.zoom, minZoom:12, maxZoom:22,
  maxBounds:CFG.limites, maxBoundsViscosity:.9,
  preferCanvas:true, zoomControl:false
});
L.control.zoom({position:'topright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomright'}).addTo(map);

const orto = L.tileLayer(CFG.orto,{
  attribution:'Ortofoto Falcon Precision',
  minZoom:0, maxZoom:22, maxNativeZoom:22, bounds:CFG.limites}).addTo(map);

const etiquetas = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:20,
   maxNativeZoom:20, pane:'shadowPane'}).addTo(map);

map.createPane('zonas');   map.getPane('zonas').style.zIndex = 410;
map.createPane('poli');    map.getPane('poli').style.zIndex    = 430;
map.createPane('calidad'); map.getPane('calidad').style.zIndex = 440;
map.createPane('pts');     map.getPane('pts').style.zIndex = 460;
map.createPane('resalte'); map.getPane('resalte').style.zIndex = 480;

const lienzo = L.canvas({pane:'pts', padding:.3});
const capaPts = L.layerGroup([],{pane:'pts'}).addTo(map);
const capaResalte = L.layerGroup([],{pane:'resalte'}).addTo(map);

/* ── carga ── */
const detalle = t => {
  const d = document.getElementById('carga-detalle');
  if(d) d.textContent = t;
};

async function traer(archivo, obligatorio=true){
  try{
    const r = await fetch(CFG.datos + archivo);
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  }catch(e){
    if(obligatorio) throw new Error('No se pudo leer ' + archivo);
    return null;
  }
}

async function arrancar(){
  try{
    detalle('indicadores');
    S.resumen = await traer('resumen.json');

    detalle('atributos');
    S.tabla = await traer('tabla.json');
    S.dominios = await traer('dominios.json', false) || {};

    detalle('geometrías');
    const geo = await traer('predios.geojson');

    detalle('indexando');
    construirIndices(geo);

    pintarCabecera();
    pintarFiltros();
    pintarCapas();
    inicializarPoligonos();
    pintarEncabezadoTabla();
    aplicarFiltros();
    dibujarPoligonos();

    document.getElementById('carga').style.display = 'none';
    traer('ficha.json', false).then(f => { S.ficha = f; });
    cargarZonas();
  }catch(e){
    document.getElementById('carga').innerHTML =
      '<div style="color:#f4426c;max-width:430px;text-align:center;line-height:1.65">'
      + e.message +
      '<div style="color:#5f7386;font-size:12px;margin-top:9px">'
      + 'Copia la carpeta <code>publico/</code> del corte a <code>data/</code> '
      + 'y abre la página por HTTP, no con doble clic.</div></div>';
  }
}

function construirIndices(geo){
  S.tabla.campos.forEach((c,i) => S.col[c.key] = i);
  const cat = S.tabla.catalogo || {};

  S.val = (fila, key) => {
    const i = S.col[key];
    if(i === undefined) return null;
    const v = fila[i];
    if(v === null || v === undefined) return null;
    return cat[key] ? cat[key][v] : v;
  };

  for(const k of ['uit','barrio','estado']){
    if(S.col[k] === undefined) continue;
    const m = new Map();
    S.tabla.filas.forEach((f,i) => {
      const v = S.val(f,k);
      if(v == null) return;
      if(!m.has(v)) m.set(v, new Set());
      m.get(v).add(i);
    });
    S.idx[k] = m;
  }

  for(const f of geo.features){
    const c = f.geometry.coordinates;
    const p = {i:f.properties.i, x:c[0], y:c[1], e:f.properties.e};
    S.puntos.push(p);
    S.porFila.set(p.i, p);
  }
  S.indice = new RBush();
  S.indice.load(S.puntos.map(p => ({minX:p.x,minY:p.y,maxX:p.x,maxY:p.y,p})));
}

/* ── filtros ── */
function interseccion(a,b){
  const ch = a.size < b.size ? a : b;
  const gr = ch === a ? b : a;
  const r = new Set();
  for(const v of ch) if(gr.has(v)) r.add(v);
  return r;
}

function aplicarFiltros(){
  const f = S.filtros;
  let res = null;
  const cruzar = c => { res = res === null ? c : interseccion(res,c); };

  if(f.uit && S.idx.uit && S.idx.uit.has(f.uit)) cruzar(S.idx.uit.get(f.uit));
  if(f.barrio && S.idx.barrio && S.idx.barrio.has(f.barrio))
    cruzar(S.idx.barrio.get(f.barrio));

  if(f.manzana){
    const s = new Set(), iN = S.col.npn;
    S.tabla.filas.forEach((fila,i) => {
      if(String(fila[iN]).startsWith(f.manzana)) s.add(i);
    });
    cruzar(s);
  }

  S.visibles = res;
  pintarChips();
  actualizarResumenFiltrado();
  redibujar();
  pintarTabla();
}

const enFiltro = i => S.visibles === null || S.visibles.has(i);

/* ── búsqueda ── */
const cajaQ = document.getElementById('q');
const cajaSug = document.getElementById('sugerencias');
let tSug = null, sugActual = [], sugSel = -1;

cajaQ.addEventListener('input', () => {
  clearTimeout(tSug);
  tSug = setTimeout(sugerir, 180);
});

cajaQ.addEventListener('keydown', e => {
  if(!cajaSug.classList.contains('abierto')) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); moverSug(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); moverSug(-1); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    const s = sugSel >= 0 ? sugActual[sugSel] : sugActual[0];
    if(s) elegirSug(s);
  }else if(e.key === 'Escape') cerrarSug();
});

function moverSug(d){
  const hijos = cajaSug.children;
  if(sugSel >= 0 && hijos[sugSel]) hijos[sugSel].classList.remove('activo');
  sugSel = Math.max(0, Math.min(sugActual.length - 1, sugSel + d));
  if(hijos[sugSel]){
    hijos[sugSel].classList.add('activo');
    hijos[sugSel].scrollIntoView({block:'nearest'});
  }
}

function sugerir(){
  const q = cajaQ.value.trim().toUpperCase();
  sugSel = -1;
  if(q.length < 2) return cerrarSug();

  const res = [];
  const tipos = [['barrio','Barrio'],['uit','Unidad']];
  for(const t of tipos){
    for(const v of (S.dominios[t[0]] || [])){
      if(String(v).toUpperCase().indexOf(q) >= 0){
        const set = S.idx[t[0]] ? S.idx[t[0]].get(v) : null;
        res.push({t:t[0], v:v, label:t[1], n:set ? set.size : 0});
        if(res.length > 6) break;
      }
    }
  }

  if(/^\d+$/.test(q)){
    const iN = S.col.npn;
    let n = 0;
    for(let i = 0; i < S.tabla.filas.length && n < 6; i++){
      const npn = String(S.tabla.filas[i][iN]);
      if(npn.indexOf(q) >= 0){
        res.push({t:'predio', v:npn, i:i,
                  label:S.val(S.tabla.filas[i],'barrio') || 'Predio'});
        n++;
      }
    }
  }

  sugActual = res.slice(0,10);
  if(!sugActual.length) return cerrarSug();

  cajaSug.innerHTML = '';
  for(const s of sugActual){
    const d = document.createElement('div');
    d.className = 'sug';
    d.innerHTML = s.t === 'predio'
      ? '<div class="mono">' + s.v + '</div><div class="meta">' + s.label + '</div>'
      : '<div>' + s.v + '</div><div class="meta">' + s.label + ' · '
        + nf(s.n) + ' predios</div>';
    d.onclick = () => elegirSug(s);
    cajaSug.appendChild(d);
  }
  cajaSug.classList.add('abierto');
}

function elegirSug(s){
  cerrarSug();
  if(s.t === 'predio'){
    cajaQ.value = s.v;
    abrirFicha(s.i);
    const p = S.porFila.get(s.i);
    if(p) map.flyTo([p.y,p.x], 19, {duration:.7});
  }else{
    cajaQ.value = '';
    S.filtros[s.t] = s.v;
    const sel = document.getElementById('f-' + s.t);
    if(sel) sel.value = s.v;
    aplicarFiltros();
    volarAZona(s.t, s.v);
  }
}

function cerrarSug(){
  cajaSug.classList.remove('abierto');
  cajaSug.innerHTML = '';
  sugActual = []; sugSel = -1;
}
document.addEventListener('click', e => {
  if(!e.target.closest('#buscar-wrap')) cerrarSug();
});

function _redibujar(){
  capaPts.clearLayers();
  const z = map.getZoom();
  document.getElementById('e-zoom').textContent = z;

  if(z < CFG.zoomPuntos){
    document.getElementById('e-vis').textContent = '—';
    return;
  }

  const b = map.getBounds().pad(.22);
  const enVista = S.indice.search({
    minX:b.getWest(), minY:b.getSouth(),
    maxX:b.getEast(), maxY:b.getNorth()});

  const r = z >= 19 ? 6 : z >= 17 ? 4.2 : 2.7;
  const hayFiltro = S.visibles !== null;
  let n = 0;

  for(const it of enVista){
    const p = it.p;
    if(S.ocultos.has(p.e)) continue;
    const dentro = !hayFiltro || S.visibles.has(p.i);
    const col = (ESTADOS[p.e] || {}).color || '#888';

    L.circleMarker([p.y,p.x],{
      renderer:lienzo, pane:'pts',
      radius: dentro ? r : r*.5,
      color: dentro ? '#07101a' : 'transparent',
      weight: (dentro && z >= 17) ? 1 : 0,
      fillColor: col,
      fillOpacity: dentro ? .93 : .16,
      interactive:false
    }).addTo(capaPts);
    if(dentro) n++;
  }

  document.getElementById('e-vis').textContent = nf(n);
  if(S.ambito === 'vis') pintarTabla();
}

function puntoEn(latlng, cp){
  if(map.getZoom() < CFG.zoomPuntos) return null;
  const tol = map.getZoom() >= 19 ? 10 : 8;
  const nw = map.containerPointToLatLng([cp.x - tol, cp.y - tol]);
  const se = map.containerPointToLatLng([cp.x + tol, cp.y + tol]);
  const cand = S.indice.search({
    minX:nw.lng, minY:se.lat, maxX:se.lng, maxY:nw.lat});
  let mejor = null, dm = Infinity;
  for(const it of cand){
    if(S.ocultos.has(it.p.e)) continue;
    if(S.visibles !== null && !S.visibles.has(it.p.i)) continue;
    const dx = it.p.x - latlng.lng, dy = it.p.y - latlng.lat;
    const d = dx*dx + dy*dy;
    if(d < dm){ dm = d; mejor = it.p; }
  }
  return mejor;
}

function resaltar(i){
  capaResalte.clearLayers();
  const p = S.porFila.get(i);
  if(!p) return;
  L.circleMarker([p.y,p.x],{
    pane:'resalte', radius:11, color:'#4cc2ff', weight:2.5,
    fillColor:'#4cc2ff', fillOpacity:.2, interactive:false
  }).addTo(capaResalte);
}

/* ══════════ POLIGONOS (terreno y construccion) ══════════

   Se leen de FlatGeobuf por rango HTTP: el navegador descarga solo los
   bytes del area visible, no el archivo entero. Cada capa aparece a
   partir de su zoom minimo, porque a escalas amplias no se distinguen
   y solo gastarian memoria.                                          */

function inicializarPoligonos(){
  const cfg = (S.resumen && S.resumen.poligonos) || {};
  const cont = document.getElementById('lista-capas');

  for(const id in cfg){
    const c = cfg[id];
    const capa = L.geoJSON(null, {
      pane:'poli',
      renderer: L.canvas({pane:'poli', padding:.2}),
      interactive:false,
      style: f => {
        const col = (ESTADOS[f.properties.e] || {}).color || c.color;
        return {color:c.color, weight:1, opacity:.85,
                fillColor:col, fillOpacity:c.relleno};
      }
    });
    S.poli[id] = {
      cfg:c, capa:capa,
      activa:true,                              // el usuario puede apagarla
      cargados:new Set(),                       // celdas ya traidas
      vistos:new Set(),                         // features ya dibujados
      unico:(id === 'terrenos'),                // 1 poligono por predio
      fgb:/\.fgb$/i.test(c.archivo),
      cargando:false, todo:false, reintento:false
    };
    cont.appendChild(filaCapa(c.label, c.color, null, true, c.n,
      on => { S.poli[id].activa = on;
              if(!on) map.removeLayer(capa); else dibujarPoligonos(); }));
  }
}

/* Rejilla de descarga: el mapa se divide en celdas fijas y se pide
   una sola vez cada celda. Sin esto, cada paneo minimo relanzaria
   la lectura de una zona ya traida.                                */
const CELDA_POLI = 0.006;   // ~660 m

function celdasDe(b){
  const r = [];
  for(let x = Math.floor(b.getWest()/CELDA_POLI);
          x <= Math.floor(b.getEast()/CELDA_POLI); x++)
    for(let y = Math.floor(b.getSouth()/CELDA_POLI);
            y <= Math.floor(b.getNorth()/CELDA_POLI); y++)
      r.push(x + ':' + y);
  return r;
}

let pendPoli = null;
function dibujarPoligonos(){
  clearTimeout(pendPoli);
  pendPoli = setTimeout(_dibujarPoligonos, 260);
}

async function _dibujarPoligonos(){
  const z = map.getZoom();

  for(const id in S.poli){
    const P = S.poli[id];

    if(!P.activa || z < P.cfg.zoom_min){
      if(map.hasLayer(P.capa)) map.removeLayer(P.capa);
      continue;
    }
    if(!map.hasLayer(P.capa)) P.capa.addTo(map);

    const b = map.getBounds().pad(.12);
    const nuevas = celdasDe(b).filter(c => !P.cargados.has(c));
    if(!nuevas.length) continue;

    if(P.cargando) continue;          // una lectura a la vez por capa
    P.cargando = true;
    nuevas.forEach(c => P.cargados.add(c));

    try{
      if(P.fgb){
        const it = flatgeobuf.deserialize(CFG.datos + P.cfg.archivo, {
          minX:b.getWest(),  minY:b.getSouth(),
          maxX:b.getEast(),  maxY:b.getNorth()
        });
        let n = 0;
        for await (const f of it){
          // la consulta por caja repite lo ya traido: se descarta aqui
          n++;
          if(P.unico && P.vistos.has(f.properties.i)) continue;
          P.capa.addData(f);
          if(P.unico) P.vistos.add(f.properties.i);
          if(n % 400 === 0) await new Promise(r => setTimeout(r, 0));
        }
      }else if(!P.todo){
        P.todo = true;               // GeoJSON: un solo archivo, una vez
        const d = await traer(P.cfg.archivo, false);
        if(d) P.capa.addData(d);
      }
    }catch(e){
      console.warn('polígonos ' + id + ':', e.message);
      nuevas.forEach(c => P.cargados.delete(c));   // permitir reintento
      if(P.fgb && !P.reintento){
        P.reintento = true;          // el servidor no admite rangos:
        P.fgb = false;               // se cae a lectura completa
      }
    }finally{
      P.cargando = false;
    }
  }
}

/* Resalta el lote del predio abierto. Si los terrenos ya estan
   dibujados, se busca ahi; si no, se pide solo esa area.          */
async function resaltarLote(i){
  const P = S.poli.terrenos;
  if(!P) return;

  let hallado = false;
  P.capa.eachLayer(l => {
    if(hallado || !l.feature || l.feature.properties.i !== i) return;
    hallado = true;
    L.geoJSON(l.feature, {pane:'resalte', interactive:false,
      style:{color:'#4cc2ff', weight:2.5,
             fillColor:'#4cc2ff', fillOpacity:.18}}).addTo(capaResalte);
  });
  if(hallado || !P.fgb) return;

  const p = S.porFila.get(i);
  if(!p) return;
  const d = 0.0012;
  try{
    const it = flatgeobuf.deserialize(CFG.datos + P.cfg.archivo,
      {minX:p.x-d, minY:p.y-d, maxX:p.x+d, maxY:p.y+d});
    for await (const f of it){
      if(f.properties.i !== i) continue;
      if(S.seleccion !== i) return;        // ya cambio la seleccion
      L.geoJSON(f, {pane:'resalte', interactive:false,
        style:{color:'#4cc2ff', weight:2.5,
               fillColor:'#4cc2ff', fillOpacity:.18}}).addTo(capaResalte);
      break;
    }
  }catch(e){ /* sin lote propio: se queda el circulo */ }
}

function pintarCabecera(){
  const r = S.resumen, est = r.estados || {}, total = r.total || 1;
  document.getElementById('sub').textContent =
    'Valledupar · corte ' + fechaCorte(r.corte);

  const ent = est.ENTREGADO || 0;

  for(const k in ESTADOS){

    i.style.width = (n/total*100) + '%';
    i.style.background = ESTADOS[k].color;
    i.title = ESTADOS[k].label + ': ' + nf(n);
    med.appendChild(i);

    const tr = document.createElement('tr');
    tr.innerHTML = '<td><span class="marca" style="background:'
      + ESTADOS[k].color + '"></span>' + ESTADOS[k].label + '</td>'

    tr.onclick = () => {
      if(S.ocultos.has(k)) S.ocultos.delete(k); else S.ocultos.add(k);
      tr.classList.toggle('off', S.ocultos.has(k));
      redibujar();
    };
    tb.appendChild(tr);
  }

  const a = r.avance;

    if(a.universo_inicial){
      h += '<div>Listado inicial · <b>' + pf(a.universo_inicial.pct)
         + ' %</b> de ' + nf(a.universo_inicial.total) + '</div>'
         + '<div><b>' + nf(a.nuevos_entregados)
         + '</b> entregados hallados en campo</div>';
    }
    document.getElementById('dual').innerHTML = h;
  }
}

function fechaCorte(c){
  if(!c || c.length !== 8) return c || '—';
  const m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return c.slice(6,8) + ' ' + m[+c.slice(4,6)-1] + ' ' + c.slice(0,4);
}

/* ── ficha ── */
function abrirFicha(i){
  const fila = S.tabla.filas[i];
  if(!fila) return;
  S.seleccion = i;
  resaltar(i);
  resaltarLote(i);

  document.getElementById('f-npn').textContent = fila[S.col.npn];
  const est = S.val(fila,'estado');
  const info = ESTADOS[est] || {label:est, color:'#888'};
  const chip = document.getElementById('f-chip');
  chip.textContent = info.label;
  chip.style.background = info.color + '22';
  chip.style.color = info.color;

  const dl = document.getElementById('f-attr');
  dl.innerHTML = '';
  agregarAttr(dl, S.tabla, i, ['npn','estado']);

  if(S.ficha){
    agregarAttr(dl, S.ficha, i, ['estado']);
  }else{
    const d = document.createElement('div');
    d.innerHTML = '<dt>Cargando detalle…</dt><dd></dd>';
    dl.appendChild(d);
    traer('ficha.json', false).then(f => {
      S.ficha = f;
      if(S.seleccion === i) abrirFicha(i);
    });
  }

  document.getElementById('ficha').classList.add('abierta');
  marcarFilaTabla(i);
}

function agregarAttr(dl, fuente, i, omitir){
  if(!fuente || !fuente.filas) return;
  const fila = fuente.filas[i];
  if(!fila) return;
  const cat = fuente.catalogo || {};

  fuente.campos.forEach((c,j) => {
    if(omitir.indexOf(c.key) >= 0) return;
    let v = fila[j];
    if(v === null || v === undefined || v === '') return;
    if(cat[c.key]) v = cat[c.key][v];
    if(v === null || v === undefined || v === '') return;

    if(c.key === 'etapa')   v = ETAPAS[v] || v;
    if(c.key === 'ini')     v = v ? 'Sí' : 'No';
    if(c.key === 'entrega') v = v === 1 ? 'Primera' : (v === 2 ? 'Segunda' : v);
    if(c.tipo === 'num' && typeof v === 'number')
      v = v.toLocaleString('es-CO',{minimumFractionDigits:c.dec||0,
                                    maximumFractionDigits:c.dec||0});

    const d = document.createElement('div');
    d.innerHTML = '<dt>' + c.label + '</dt><dd>' + v + '</dd>';
    dl.appendChild(d);
  });
}

function cerrarFicha(){
  document.getElementById('ficha').classList.remove('abierta');
  capaResalte.clearLayers();
  S.seleccion = null;
  marcarFilaTabla(null);
}
document.getElementById('f-cerrar').onclick = cerrarFicha;

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(cajaSug.classList.contains('abierto')) cerrarSug();
  else if(S.seleccion !== null) cerrarFicha();
  else if(document.getElementById('gaveta').classList.contains('abierta'))
    cerrarGaveta();
});

/* ── tabla con scroll virtual ── */
const COLS = ['npn','barrio','uit','estado','etapa'];
const ANCHOS = {npn:'34%', barrio:'26%', uit:'12%', estado:'16%', etapa:'12%'};
const scroll = document.getElementById('scroll');
const tbody = document.getElementById('tbody');
let listaTabla = [];

function pintarEncabezadoTabla(){
  const th = document.getElementById('thead');
  th.innerHTML = '';
  for(const k of COLS){
    const c = S.tabla.campos.find(x => x.key === k) || {label:k};
    const t = document.createElement('th');
    t.style.width = ANCHOS[k] || 'auto';
    t.dataset.k = k;
    t.innerHTML = c.label + '<span class="flecha"></span>';
    t.onclick = () => {
      S.orden = {campo:k, asc: S.orden.campo === k ? !S.orden.asc : true};
      pintarTabla();
    };
    th.appendChild(t);
  }
}

function pintarTabla(){
  if(!document.getElementById('gaveta').classList.contains('abierta')) return;

  let base;
  if(S.ambito === 'vis' && map.getZoom() >= CFG.zoomPuntos){
    const b = map.getBounds();
    base = S.indice.search({minX:b.getWest(), minY:b.getSouth(),
                            maxX:b.getEast(), maxY:b.getNorth()})
             .map(it => it.p.i).filter(enFiltro);
  }else{
    base = S.visibles === null
      ? S.tabla.filas.map((_,i) => i)
      : Array.from(S.visibles);
  }
  if(S.ocultos.size){
    base = base.filter(i => !S.ocultos.has(S.val(S.tabla.filas[i],'estado')));
  }

  const k = S.orden.campo, dir = S.orden.asc ? 1 : -1;
  base.sort((a,b) => {
    const va = S.val(S.tabla.filas[a], k), vb = S.val(S.tabla.filas[b], k);
    const xa = va === null || va === undefined ? '' : va;
    const xb = vb === null || vb === undefined ? '' : vb;
    return xa < xb ? -dir : (xa > xb ? dir : 0);
  });

  listaTabla = base;
  document.getElementById('g-cuenta').textContent = nf(base.length) + ' predios';

  const ths = document.querySelectorAll('#thead th');
  for(const t of ths){
    t.querySelector('.flecha').textContent =
      t.dataset.k === k ? (S.orden.asc ? '▲' : '▼') : '';
  }

  scroll.scrollTop = 0;
  render();
}

scroll.addEventListener('scroll', () => requestAnimationFrame(render));

function render(){
  const alto = CFG.filaAlto;
  const total = listaTabla.length;
  const desde = Math.max(0, Math.floor(scroll.scrollTop / alto) - 6);
  const hasta = Math.min(total, desde + Math.ceil(scroll.clientHeight / alto) + 12);
  const arriba = desde * alto;
  const abajo = Math.max(0, (total - hasta) * alto);

  let html = arriba ? '<tr style="height:' + arriba + 'px"><td colspan="5"></td></tr>' : '';
  for(let n = desde; n < hasta; n++){
    const i = listaTabla[n];
    const f = S.tabla.filas[i];
    const est = S.val(f,'estado');
    const col = (ESTADOS[est] || {}).color || '#888';
    const etapa = S.val(f,'etapa');
    html += '<tr data-i="' + i + '"' + (i === S.seleccion ? ' class="sel"' : '') + '>'
      + '<td class="mono">' + f[S.col.npn] + '</td>'
      + '<td>' + (S.val(f,'barrio') || '') + '</td>'
      + '<td>' + (S.val(f,'uit') || '') + '</td>'
      + '<td><span class="punto-est" style="background:' + col + '"></span>'
      + ((ESTADOS[est] || {}).label || est || '') + '</td>'
      + '<td>' + (ETAPAS[etapa] || '') + '</td></tr>';
  }
  if(abajo) html += '<tr style="height:' + abajo + 'px"><td colspan="5"></td></tr>';
  tbody.innerHTML = html;
}

tbody.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]');
  if(!tr) return;
  const i = +tr.dataset.i;
  abrirFicha(i);
  const p = S.porFila.get(i);
  if(p) map.flyTo([p.y,p.x], Math.max(map.getZoom(), 18), {duration:.6});
});

tbody.addEventListener('mouseover', e => {
  const tr = e.target.closest('tr[data-i]');
  if(tr) resaltar(+tr.dataset.i);
});
tbody.addEventListener('mouseleave', () => {
  if(S.seleccion !== null) resaltar(S.seleccion);
  else capaResalte.clearLayers();
});

function marcarFilaTabla(i){
  const previas = tbody.querySelectorAll('tr.sel');
  for(const t of previas) t.classList.remove('sel');
  if(i === null) return;
  const tr = tbody.querySelector('tr[data-i="' + i + '"]');
  if(tr){ tr.classList.add('sel'); return; }
  const n = listaTabla.indexOf(i);
  if(n >= 0){
    scroll.scrollTop = Math.max(0, n*CFG.filaAlto - scroll.clientHeight/2);
    render();
  }
}

const gaveta = document.getElementById('gaveta');
function abrirGaveta(){
  gaveta.classList.add('abierta');
  document.documentElement.style.setProperty('--gaveta','290px');
  setTimeout(() => map.invalidateSize(), 240);
  pintarTabla();
}
function cerrarGaveta(){
  gaveta.classList.remove('abierta');
  document.documentElement.style.setProperty('--gaveta','0px');
  setTimeout(() => map.invalidateSize(), 240);
}
document.getElementById('abrir-tabla').onclick = abrirGaveta;
document.getElementById('g-cerrar').onclick = cerrarGaveta;

document.getElementById('g-todos').onclick = function(){
  S.ambito = 'todos';
  this.classList.add('on');
  document.getElementById('g-vis').classList.remove('on');
  pintarTabla();
};
document.getElementById('g-vis').onclick = function(){
  S.ambito = 'vis';
  this.classList.add('on');
  document.getElementById('g-todos').classList.remove('on');
  pintarTabla();
};

document.getElementById('g-csv').onclick = () => {
  const cab = COLS.map(k => (S.tabla.campos.find(c => c.key === k) || {label:k}).label);
  const lin = [cab.join(';')];
  for(const i of listaTabla){
    const f = S.tabla.filas[i];
    lin.push(COLS.map(k => {
      let v = k === 'npn' ? f[S.col.npn] : S.val(f,k);
      if(k === 'estado') v = (ESTADOS[v] || {}).label || v;
      if(k === 'etapa')  v = ETAPAS[v] || v;
      return v == null ? '' : String(v).replace(/;/g, ',');
    }).join(';'));
  }
  const blob = new Blob(['\uFEFF' + lin.join('\r\n')],
                        {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'predios_' + S.resumen.corte + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ── capas ── */
function filaCapa(label, color, capa, activa, n, alCambiar){
  const div = document.createElement('label');
  div.className = 'fila-capa';
  div.innerHTML = '<input type="checkbox"' + (activa ? ' checked' : '') + '>'
    + (color ? '<span class="pin" style="background:' + color + '"></span>' : '')
    + '<span>' + label + '</span>'
    + (n != null ? '<span class="n mono">' + nf(n) + '</span>' : '');
  div.querySelector('input').onchange = e => {
    if(alCambiar) return alCambiar(e.target.checked);
    if(!capa) return;
    if(e.target.checked) capa.addTo(map); else map.removeLayer(capa);
  };
  return div;
}

function pintarCapas(){
  const c = document.getElementById('lista-capas');
  c.appendChild(filaCapa('Ortofoto', null, orto, true));
  c.appendChild(filaCapa('Calles y nombres', null, etiquetas, true));
}

const EST_ZONA = {
  perimetro:{color:'#ffffff', weight:3,   opacity:.95, fillOpacity:0,
             dashArray:'9,6', halo:'#080d12'},
  uit:      {color:'#4cc2ff', weight:2.4, opacity:.9,  fillOpacity:.05},
  barrios:  {color:'#ffd166', weight:1.7, opacity:.8,  fillOpacity:.06}
};

async function cargarZonas(){
  const cont = document.getElementById('lista-capas');
  const defs = [
    {a:'contexto/perimetro.geojson', l:'Perímetro urbano', k:'perimetro',
     campo:'Nombre', on:true, halo:true},
    {a:'contexto/uit.geojson', l:'Unidades de intervención', k:'uit',
     campo:'Nombre', on:true, filtro:'uit'},
    {a:'contexto/barrios.geojson', l:'Barrios', k:'barrios',
     campo:'NOMBRE', on:true, filtro:'barrio'}
  ];

  for(const d of defs){
    const geo = await traer(d.a, false);
    if(!geo) continue;
    const est = EST_ZONA[d.k];

    // halo oscuro debajo: hace legible la línea sobre la ortofoto
    if(d.halo){
      const h = L.geoJSON(geo,{pane:'zonas', interactive:false,
        style:{color:est.halo, weight:est.weight + 3, opacity:.45, fillOpacity:0}});
      if(d.on) h.addTo(map);
    }

    const capa = L.geoJSON(geo,{
      pane:'zonas',
      style:{color:est.color, weight:est.weight, opacity:est.opacity,
             fillColor:est.color, fillOpacity:est.fillOpacity,
             dashArray:est.dashArray},
      onEachFeature:(f,l) => {
        const nombre = f.properties ? f.properties[d.campo] : null;
        if(nombre) l.bindTooltip(String(nombre), {sticky:true, className:'zona'});
        if(!d.filtro) return;

        l.on('mouseover', () => l.setStyle({weight:est.weight + 1.4,
                                            fillOpacity:.16, opacity:1}));
        l.on('mouseout', () => {
          if(S.filtros[d.filtro] === String(nombre)) return;
          l.setStyle({weight:est.weight, fillOpacity:est.fillOpacity,
                      opacity:est.opacity, color:est.color});
        });
        l.on('contextmenu', ev => {
          L.DomEvent.stop(ev);
          const val = String(nombre);
          const nuevo = S.filtros[d.filtro] === val ? '' : val;
          S.filtros[d.filtro] = nuevo;
          const sel = document.getElementById('f-' + d.filtro);
          if(sel) sel.value = nuevo;
          aplicarFiltros();
          if(nuevo) volarAZona(d.filtro, nuevo); else quitarZona();
        });
      }
    });
    if(d.on) capa.addTo(map);
    if(d.filtro) S.zonas[d.filtro] = {capa:capa, campo:d.campo, est:est};

    cont.appendChild(filaCapa(d.l, est.color, capa, d.on,
                              geo.features ? geo.features.length : null));
  }
  await cargarCalidad();
}

function volarAZona(tipo, valor){
  quitarZona();
  const ref = S.zonas[tipo];
  if(!ref || !valor) return;

  let caja = null;
  ref.capa.eachLayer(l => {
    if(String(l.feature.properties[ref.campo]) !== valor) return;
    l.setStyle({weight:ref.est.weight + 2, opacity:1, fillOpacity:.14,
                color:'#4cc2ff'});
    l.bringToFront();
    caja = caja ? caja.extend(l.getBounds()) : l.getBounds();
  });
  if(caja) encuadrar(caja);
}

/* Encuadra una zona dejándola visible entre los paneles.
   Los paneles flotan sobre el mapa, así que el centro geométrico
   no es el centro visible: el padding se calcula por lado. */
function encuadrar(caja){
  const anchoPanelIzq = window.innerWidth > 1000 ? 600 : 40;
  const anchoPanelDer = document.getElementById('ficha')
                          .classList.contains('abierta') ? 330 : 40;
  const alturaGaveta = document.getElementById('gaveta')
                         .classList.contains('abierta') ? 60 : 40;

  S.volando = true;
  map.flyToBounds(caja, {
    paddingTopLeft:     [anchoPanelIzq, 40],
    paddingBottomRight: [anchoPanelDer, alturaGaveta],
    duration: .85,
    easeLinearity: .25
  });
}

function quitarZona(){
  for(const t in S.zonas){
    const ref = S.zonas[t];
    ref.capa.eachLayer(l => l.setStyle({
      color:ref.est.color, weight:ref.est.weight,
      opacity:ref.est.opacity, fillOpacity:ref.est.fillOpacity}));
  }
}

async function cargarCalidad(){
  const man = await traer('../opcionales/manifiesto.json', false)
           || await traer('manifiesto.json', false);
  const cont = document.getElementById('lista-calidad');
  if(!man || !man.opcionales){
    cont.innerHTML = '<div style="font-size:11.5px;color:var(--texto-3)">'
      + 'Sin capas de revisión en este corte.</div>';
    return;
  }
  for(const o of man.opcionales){
    if(o.tipo !== 'geojson'){
      const d = document.createElement('div');
      d.className = 'fila-capa';
      d.style.cursor = 'default';
      d.innerHTML = '<span class="pin" style="background:' + o.color
        + ';opacity:.5"></span><span title="' + o.desc + '">' + o.label
        + '</span><span class="n mono">' + nf(o.n) + '</span>';
      cont.appendChild(d);
      continue;
    }
    const geo = await traer('../opcionales/' + o.archivo, false)
             || await traer(o.archivo, false);
    if(!geo) continue;
    const capa = L.geoJSON(geo,{
      pane:'calidad',
      style:{color:o.color, weight:1.5, fillColor:o.color, fillOpacity:.22},
      onEachFeature:(f,l) => l.bindTooltip(
        o.label + '<br><span class="mono">'
        + (f.properties.npn || f.properties.cons || '') + '</span>',
        {className:'zona'})
    });
    cont.appendChild(filaCapa(o.label, o.color, capa, false,
                              geo.features ? geo.features.length : o.n));
  }
}
