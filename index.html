<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Avance catastral · Valledupar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/rbush@4.0.1/rbush.min.js"></script>

<style>
:root{
  --tinta:#10161c;          /* fondo de paneles */
  --tinta-2:#1a232c;
  --linea:#2c3946;
  --texto:#e6edf3;
  --texto-2:#8fa3b5;

  --entregado:#22c55e;
  --listo:#38bdf8;
  --proceso:#f5a524;
  --error:#f4426c;
  --cancelado:#7c8b99;
  --sin-matriz:#a78bfa;

  --comision:#e53935;
  --omision:#8e24aa;
  --pendiente:#9e9e9e;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:14px/1.45 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--texto); background:#0b1116;
}
#mapa{position:absolute;inset:0;background:#0b1116}

.mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      font-variant-numeric:tabular-nums}

/* ---------- paneles flotantes ---------- */
.panel{
  position:absolute; z-index:600;
  background:rgba(16,22,28,.94);
  border:1px solid var(--linea);
  border-radius:4px;
  backdrop-filter:blur(6px);
  box-shadow:0 8px 28px rgba(0,0,0,.55);
}

/* --- cabecera --- */
#cabecera{
  top:12px; left:12px; right:auto;
  padding:14px 18px 12px; min-width:290px; max-width:330px;
}
#cabecera h1{
  margin:0 0 2px; font-size:15px; font-weight:600; letter-spacing:-.01em;
}
#cabecera .sub{color:var(--texto-2); font-size:11.5px; margin-bottom:14px}

.cifra{display:flex; align-items:baseline; gap:9px; margin-bottom:3px}
.cifra .n{font-size:34px; font-weight:600; letter-spacing:-.03em; line-height:1}
.cifra .pct{font-size:14px; color:var(--entregado); font-weight:600}
.cifra-pie{color:var(--texto-2); font-size:11.5px; margin-bottom:14px}

.medidor{height:5px; background:#111b22; border-radius:3px; overflow:hidden;
         display:flex; margin-bottom:14px}
.medidor i{display:block; height:100%}

table.tot{width:100%; border-collapse:collapse; font-size:12.5px}
table.tot td{padding:3px 0; border:0}
table.tot td:last-child{text-align:right}
table.tot .marca{
  display:inline-block; width:9px; height:9px; border-radius:2px;
  margin-right:7px; vertical-align:-1px;
}
table.tot tr{cursor:pointer}
table.tot tr:hover td{color:#fff}
table.tot tr.off{opacity:.32}

.divisor{height:1px; background:var(--linea); margin:13px 0 11px}

.dual{font-size:11.5px; color:var(--texto-2); line-height:1.7}
.dual b{color:var(--texto); font-weight:600}

/* --- capas --- */
#capas{
  bottom:12px; left:12px; padding:11px 14px 12px; min-width:250px;
}
#capas .titulo{
  font-size:11px; color:var(--texto-2); margin-bottom:9px;
}
.fila-capa{
  display:flex; align-items:center; gap:9px; padding:4px 0;
  cursor:pointer; font-size:12.5px; user-select:none;
}
.fila-capa:hover{color:#fff}
.fila-capa input{accent-color:#38bdf8; margin:0; cursor:pointer}
.fila-capa .n{margin-left:auto; color:var(--texto-2); font-size:11.5px}
.fila-capa .pin{
  width:9px;height:9px;border-radius:2px;flex:none;
}

#capas details{margin-top:8px}
#capas summary{
  cursor:pointer; font-size:11px; color:var(--texto-2); outline:none;
  padding:3px 0;
}
#capas summary:hover{color:var(--texto)}
.aviso{
  font-size:11px; color:#f5a524; line-height:1.5; margin:7px 0 4px;
}

/* --- ficha del predio --- */
#ficha{
  top:12px; right:12px; width:308px; max-height:calc(100vh - 24px);
  padding:0; display:none; overflow:hidden; flex-direction:column;
}
#ficha.abierta{display:flex}
#ficha .cab{
  padding:13px 15px 11px; border-bottom:1px solid var(--linea);
  display:flex; align-items:flex-start; gap:10px;
}
#ficha .npn{font-size:13px; letter-spacing:.01em; word-break:break-all; line-height:1.4}
#ficha .cerrar{
  margin-left:auto; background:none; border:0; color:var(--texto-2);
  font-size:19px; line-height:1; cursor:pointer; padding:0 2px;
}
#ficha .cerrar:hover{color:#fff}
#ficha .cuerpo{padding:5px 15px 15px; overflow-y:auto}

.chip{
  display:inline-block; padding:2px 9px; border-radius:11px;
  font-size:11px; font-weight:600; margin:9px 0 2px;
}

dl.attr{margin:0; font-size:12.5px}
dl.attr div{
  display:flex; gap:10px; padding:5px 0;
  border-bottom:1px solid rgba(44,57,70,.5);
}
dl.attr dt{color:var(--texto-2); flex:0 0 44%; font-size:11.5px}
dl.attr dd{margin:0; flex:1; text-align:right; word-break:break-word}

/* --- barra inferior derecha --- */
#estado{
  bottom:12px; right:12px; padding:7px 13px; font-size:11.5px;
  color:var(--texto-2);
}
#estado b{color:var(--texto); font-weight:600}

/* --- carga --- */
#carga{
  position:absolute; inset:0; z-index:1200; display:flex;
  align-items:center; justify-content:center; flex-direction:column;
  gap:13px; background:#0b1116; color:var(--texto-2); font-size:13px;
}
#carga .barra{width:190px;height:2px;background:#1c2731;overflow:hidden}
#carga .barra i{display:block;height:100%;width:38%;background:#38bdf8;
  animation:desliza 1.05s ease-in-out infinite}
@keyframes desliza{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}

.leaflet-control-attribution{
  background:rgba(16,22,28,.85)!important; color:var(--texto-2)!important;
  font-size:10px!important;
}
.leaflet-control-attribution a{color:#7fb4d6!important}
.leaflet-control-zoom a{
  background:rgba(16,22,28,.94)!important; color:var(--texto)!important;
  border-color:var(--linea)!important;
}
.leaflet-control-zoom a:hover{background:var(--tinta-2)!important}
.leaflet-control-scale-line{
  background:rgba(16,22,28,.8)!important; color:var(--texto)!important;
  border-color:var(--linea)!important;
}

@media (max-width:820px){
  #cabecera{max-width:none; right:12px; min-width:0}
  #ficha{top:auto; bottom:12px; left:12px; right:12px; width:auto; max-height:52vh}
  #capas,#estado{display:none}
}
</style>
</head>
<body>

<div id="mapa"></div>

<div id="carga">
  <div>Cargando predios…</div>
  <div class="barra"><i></i></div>
  <div id="carga-detalle" style="font-size:11.5px"></div>
</div>

<!-- ---------- cabecera ---------- -->
<div class="panel" id="cabecera">
  <h1>Avance de actualización catastral</h1>
  <div class="sub" id="sub">Valledupar · corte —</div>

  <div class="cifra">
    <span class="n mono" id="c-entregado">—</span>
    <span class="pct mono" id="c-pct"></span>
  </div>
  <div class="cifra-pie">predios entregados</div>

  <div class="medidor" id="medidor"></div>

  <table class="tot"><tbody id="totales"></tbody></table>

  <div class="divisor"></div>

  <div class="dual" id="dual"></div>
</div>

<!-- ---------- capas ---------- -->
<div class="panel" id="capas">
  <div class="titulo">Capas</div>
  <div id="lista-capas"></div>

  <details id="det-calidad">
    <summary>Revisión de calidad</summary>
    <div class="aviso">Estas capas no cuentan en el avance. Revísalas antes de publicar.</div>
    <div id="lista-calidad"></div>
  </details>
</div>

<!-- ---------- ficha ---------- -->
<div class="panel" id="ficha">
  <div class="cab">
    <div>
      <div style="font-size:11px;color:var(--texto-2)">Predio</div>
      <div class="npn mono" id="f-npn"></div>
    </div>
    <button class="cerrar" id="f-cerrar" aria-label="Cerrar">×</button>
  </div>
  <div class="cuerpo">
    <span class="chip" id="f-chip"></span>
    <dl class="attr" id="f-attr"></dl>
  </div>
</div>

<div class="panel" id="estado">
  <b id="e-vis">0</b> visibles · zoom <b id="e-zoom">15</b>
</div>

<script>
/* ==========================================================
   CONFIGURACION
   ========================================================== */
const CFG = {
  datos: 'data/',
  orto:  'https://xyz1.falconprecision.co/valledupar-urbano/Z{z}/{y}/{x}.png',
  centro: [10.4631, -73.2532],
  zoom: 14,
  limites: [[10.38, -73.32], [10.55, -73.18]],
  zoomPuntos: 15          // debajo de esto no se dibujan puntos
};

const ESTADOS = {
  ENTREGADO:   {label:'Entregado',        color:'#22c55e'},
  LISTO:       {label:'Listo para SIG',   color:'#38bdf8'},
  EN_PROCESO:  {label:'En proceso',       color:'#f5a524'},
  ERROR_ETAPA: {label:'Error de etapa',   color:'#f4426c'},
  CANCELADO:   {label:'Cancelado',        color:'#7c8b99'},
  SIN_MATRIZ:  {label:'Sin matriz',       color:'#a78bfa'}
};

const ETAPAS = {juridico:'Jurídico', reconocimiento:'Reconocimiento',
                geografico:'Geográfico'};

/* ==========================================================
   ESTADO CENTRAL
   ========================================================== */
const app = {
  puntos: null,        // FeatureCollection
  atributos: null,     // {campos, filas}
  resumen: null,
  indice: null,        // RBush
  porNpn: new Map(),   // npn -> fila
  apagados: new Set(), // estados ocultos
  seleccion: null,
  capasCalidad: {}
};

/* ==========================================================
   MAPA
   ========================================================== */
const map = L.map('mapa', {
  center: CFG.centro,
  zoom: CFG.zoom,
  minZoom: 12,
  maxZoom: 22,
  maxBounds: CFG.limites,
  maxBoundsViscosity: .9,
  preferCanvas: true,
  zoomControl: false,
  attributionControl: true
});

L.control.zoom({position:'topright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);

const orto = L.tileLayer(CFG.orto, {
  attribution:'Ortofoto Falcon Precision',
  minZoom:0, maxZoom:22, maxNativeZoom:22, tms:false,
  bounds: CFG.limites
}).addTo(map);

const etiquetas = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:20,
   maxNativeZoom:20, pane:'shadowPane'}
).addTo(map);

/* paneles de dibujo, para controlar el orden de apilado */
map.createPane('ctx');      map.getPane('ctx').style.zIndex = 410;
map.createPane('calidad');  map.getPane('calidad').style.zIndex = 440;
map.createPane('pts');      map.getPane('pts').style.zIndex = 460;

const lienzo = L.canvas({pane:'pts', padding:.35});
const capaPuntos = L.layerGroup([], {pane:'pts'}).addTo(map);

/* ==========================================================
   CARGA
   ========================================================== */
async function traer(archivo, obligatorio=true){
  try{
    const r = await fetch(CFG.datos + archivo);
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  }catch(e){
    if(obligatorio) throw new Error(`No se pudo leer ${archivo}`);
    return null;
  }
}

function detalle(txt){
  document.getElementById('carga-detalle').textContent = txt;
}

async function arrancar(){
  try{
    detalle('indicadores');
    app.resumen = await traer('resumen.json');

    detalle('geometrías');
    app.puntos = await traer('predios.geojson');

    detalle('atributos');
    app.atributos = await traer('atributos.json');

    detalle('indexando');
    indexar();

    pintarCabecera();
    pintarCapas();
    redibujar();

    await cargarContexto();

    document.getElementById('carga').style.display = 'none';
  }catch(e){
    document.getElementById('carga').innerHTML =
      `<div style="color:#f4426c;max-width:420px;text-align:center;line-height:1.6">
         ${e.message}<br>
         <span style="color:var(--texto-2);font-size:12px">
           Copia la carpeta <code>publico/</code> del corte a <code>data/</code>
           y sirve la página por HTTP.</span>
       </div>`;
  }
}

function indexar(){
  /* atributos por NPN */
  const cs = app.atributos.campos.map(c => c.key);
  const iN = cs.indexOf('npn');
  for(const fila of app.atributos.filas){
    app.porNpn.set(fila[iN], fila);
  }

  /* indice espacial de los puntos */
  app.indice = new RBush();
  const items = app.puntos.features.map(f => {
    const [x,y] = f.geometry.coordinates;
    return {minX:x, minY:y, maxX:x, maxY:y, f:f};
  });
  app.indice.load(items);
}

/* ==========================================================
   DIBUJO DE PUNTOS  (solo lo visible)
   ========================================================== */
let pendiente = null;

function redibujar(){
  clearTimeout(pendiente);
  pendiente = setTimeout(_redibujar, 90);
}

function _redibujar(){
  capaPuntos.clearLayers();
  const z = map.getZoom();
  document.getElementById('e-zoom').textContent = z;

  if(z < CFG.zoomPuntos){
    document.getElementById('e-vis').textContent = '—';
    return;
  }

  const b = map.getBounds().pad(.25);
  const enVista = app.indice.search({
    minX:b.getWest(), minY:b.getSouth(),
    maxX:b.getEast(), maxY:b.getNorth()
  });

  const r = z >= 19 ? 6 : z >= 17 ? 4 : 2.6;
  let n = 0;

  for(const it of enVista){
    const p = it.f.properties;
    if(app.apagados.has(p.e)) continue;
    const col = (ESTADOS[p.e] || {}).color || '#888';
    const [x,y] = it.f.geometry.coordinates;

    L.circleMarker([y,x], {
      renderer: lienzo,
      radius: r,
      color: '#08111a',
      weight: z >= 17 ? 1 : 0,
      fillColor: col,
      fillOpacity: .92,
      pane: 'pts'
    }).on('click', () => abrirFicha(p.n)).addTo(capaPuntos);
    n++;
  }
  document.getElementById('e-vis').textContent = n.toLocaleString('es-CO');
}

map.on('moveend zoomend', redibujar);

/* ==========================================================
   CABECERA
   ========================================================== */
function pintarCabecera(){
  const r = app.resumen;
  const est = r.estados || {};
  const total = r.total || 1;

  document.getElementById('sub').textContent =
    `Valledupar · corte ${fechaCorte(r.corte)}`;

  const ent = est.ENTREGADO || 0;
  document.getElementById('c-entregado').textContent = ent.toLocaleString('es-CO');
  document.getElementById('c-pct').textContent =
    (ent/total*100).toFixed(1).replace('.',',') + ' %';

  /* medidor apilado */
  const med = document.getElementById('medidor');
  med.innerHTML = '';
  for(const k of Object.keys(ESTADOS)){
    const n = est[k]; if(!n) continue;
    const i = document.createElement('i');
    i.style.width = (n/total*100) + '%';
    i.style.background = ESTADOS[k].color;
    i.title = `${ESTADOS[k].label}: ${n.toLocaleString('es-CO')}`;
    med.appendChild(i);
  }

  /* tabla de totales, clicable para filtrar */
  const tb = document.getElementById('totales');
  tb.innerHTML = '';
  for(const k of Object.keys(ESTADOS)){
    const n = est[k]; if(!n) continue;
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td><span class="marca" style="background:${ESTADOS[k].color}"></span>${ESTADOS[k].label}</td>
       <td class="mono">${n.toLocaleString('es-CO')}</td>`;
    tr.onclick = () => {
      app.apagados.has(k) ? app.apagados.delete(k) : app.apagados.add(k);
      tr.classList.toggle('off', app.apagados.has(k));
      redibujar();
    };
    tb.appendChild(tr);
  }

  /* avance sobre los dos universos */
  const a = r.avance;
  if(a){
    let h = `<div>Universo actual · <b>${a.universo_actual.pct.toFixed(1).replace('.',',')} %</b>
             de ${a.universo_actual.total.toLocaleString('es-CO')}</div>`;
    if(a.universo_inicial){
      h += `<div>Listado inicial · <b>${a.universo_inicial.pct.toFixed(1).replace('.',',')} %</b>
            de ${a.universo_inicial.total.toLocaleString('es-CO')}</div>`;
      h += `<div><b>${a.nuevos_entregados.toLocaleString('es-CO')}</b> entregados
            hallados en campo</div>`;
    }
    document.getElementById('dual').innerHTML = h;
  }
}

function fechaCorte(c){
  if(!c || c.length !== 8) return c || '—';
  const m = ['ene','feb','mar','abr','may','jun',
             'jul','ago','sep','oct','nov','dic'];
  return `${c.slice(6,8)} ${m[+c.slice(4,6)-1]} ${c.slice(0,4)}`;
}

/* ==========================================================
   FICHA
   ========================================================== */
function abrirFicha(npn){
  const fila = app.porNpn.get(npn);
  if(!fila) return;
  app.seleccion = npn;

  const campos = app.atributos.campos;
  document.getElementById('f-npn').textContent = npn;

  const iEst = campos.findIndex(c => c.key === 'estado');
  const est  = fila[iEst];
  const info = ESTADOS[est] || {label:est, color:'#888'};
  const chip = document.getElementById('f-chip');
  chip.textContent = info.label;
  chip.style.background = info.color + '22';
  chip.style.color = info.color;

  const dl = document.getElementById('f-attr');
  dl.innerHTML = '';
  campos.forEach((c, i) => {
    if(c.key === 'npn' || c.key === 'estado') return;
    let v = fila[i];
    if(v === null || v === undefined || v === '') return;

    if(c.key === 'etapa')   v = ETAPAS[v] || v;
    if(c.key === 'ini')     v = v ? 'Sí' : 'No';
    if(c.key === 'entrega') v = v === 1 ? 'Primera' : v === 2 ? 'Segunda' : v;
    if(c.tipo === 'num' && typeof v === 'number')
      v = v.toLocaleString('es-CO', {minimumFractionDigits:c.dec||0,
                                     maximumFractionDigits:c.dec||0});

    const d = document.createElement('div');
    d.innerHTML = `<dt>${c.label}</dt><dd>${v}</dd>`;
    dl.appendChild(d);
  });

  document.getElementById('ficha').classList.add('abierta');
}

document.getElementById('f-cerrar').onclick = () => {
  document.getElementById('ficha').classList.remove('abierta');
  app.seleccion = null;
};
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') document.getElementById('f-cerrar').click();
});

/* ==========================================================
   CAPAS
   ========================================================== */
function filaCapa(id, label, color, capa, activa, n){
  const div = document.createElement('label');
  div.className = 'fila-capa';
  div.innerHTML =
    `<input type="checkbox" ${activa?'checked':''}>
     ${color ? `<span class="pin" style="background:${color}"></span>` : ''}
     <span>${label}</span>
     ${n != null ? `<span class="n mono">${n.toLocaleString('es-CO')}</span>` : ''}`;
  div.querySelector('input').onchange = e => {
    if(!capa) return;
    e.target.checked ? capa.addTo(map) : map.removeLayer(capa);
  };
  return div;
}

function pintarCapas(){
  const cont = document.getElementById('lista-capas');
  cont.appendChild(filaCapa('orto','Ortofoto',null,orto,true));
  cont.appendChild(filaCapa('lbl','Calles y nombres',null,etiquetas,true));
}

async function cargarContexto(){
  const ctx = [
    {a:'contexto/perimetro.geojson', l:'Perímetro urbano', c:'#ffffff',
     s:{color:'#ffffff',weight:2,fillOpacity:0,dashArray:'5,4'}, on:true},
    {a:'contexto/uit.geojson', l:'Unidades de intervención', c:'#4fc3f7',
     s:{color:'#4fc3f7',weight:2,fillOpacity:0}, on:true, etq:'Nombre'},
    {a:'contexto/barrios.geojson', l:'Barrios', c:'#b0bec5',
     s:{color:'#b0bec5',weight:.8,fillOpacity:0,opacity:.55}, on:false, etq:'NOMBRE'}
  ];

  const cont = document.getElementById('lista-capas');
  for(const c of ctx){
    const d = await traer(c.a, false);
    if(!d) continue;
    const capa = L.geoJSON(d, {
      pane:'ctx', style:c.s, interactive:!!c.etq,
      onEachFeature:(f,l)=>{
        const t = c.etq && f.properties[c.etq];
        if(t) l.bindTooltip(String(t), {sticky:true});
      }
    });
    if(c.on) capa.addTo(map);
    cont.appendChild(filaCapa(c.a, c.l, c.c, capa, c.on,
                              d.features ? d.features.length : null));
  }

  await cargarCalidad();
}

/* capas de revisión: comisión, omisión, pendientes */
async function cargarCalidad(){
  const man = await traer('../opcionales/manifiesto.json', false)
           || await traer('manifiesto.json', false);
  const cont = document.getElementById('lista-calidad');

  if(!man || !man.opcionales){
    cont.innerHTML =
      `<div style="font-size:11.5px;color:var(--texto-2)">
         Sin capas de revisión en este corte.</div>`;
    return;
  }

  for(const o of man.opcionales){
    if(o.tipo !== 'geojson'){
      const div = document.createElement('div');
      div.className = 'fila-capa';
      div.style.cursor = 'default';
      div.innerHTML =
        `<span class="pin" style="background:${o.color};opacity:.5"></span>
         <span title="${o.desc}">${o.label}</span>
         <span class="n mono">${(o.n||0).toLocaleString('es-CO')}</span>`;
      cont.appendChild(div);
      continue;
    }
    const d = await traer('../opcionales/' + o.archivo, false)
           || await traer(o.archivo, false);
    if(!d) continue;
    const capa = L.geoJSON(d, {
      pane:'calidad',
      style:{color:o.color, weight:1.4, fillColor:o.color, fillOpacity:.22},
      onEachFeature:(f,l)=>l.bindTooltip(
        `${o.label}<br><span class="mono">${f.properties.npn||f.properties.cons||''}</span>`)
    });
    app.capasCalidad[o.id] = capa;
    cont.appendChild(filaCapa(o.id, o.label, o.color, capa, false,
                              d.features ? d.features.length : o.n));
  }
}

arrancar();
</script>
</body>
